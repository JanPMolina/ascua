  schemas:
    # ───────────── Tipos base ─────────────
    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      format: date-time
      maxLength: 35
      description: Instante UTC (RFC 3339) según el reloj del servidor.
    NullableTimestamp:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    RoundNumber:
      type: integer
      minimum: 1
      maximum: 60
      description: Número de ronda (máximo 60; al agotarse, el Umbral se apaga).
    Seq:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Secuencia monótona de eventos de la partida.
    Direction:
      type: string
      enum: [N, S, E, W]
    Position:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 8 }
        y: { type: integer, minimum: 0, maximum: 8 }
    NullablePosition:
      anyOf:
        - $ref: '#/components/schemas/Position'
        - type: 'null'
    DisplayName:
      type: string
      minLength: 3
      maxLength: 32
    HeroKind:
      type: string
      enum: [ERRATA, ANTEAYER, HILVAN, POLIZON, ESCUCHA, USURERA, AVARO, MAMPOSTERO, CAMPANERO]
    HeroState:
      type: string
      enum: [ALIVE, DOWN, EXTINCT, RETIRED, EMBER_SPIRIT, RENEGADE]
      description: |
        `DOWN` = caído; `EXTINCT` = extinto (eligiendo camino); `RETIRED` = abandonó. Desde 1.3.0:
        `EMBER_SPIRIT` = Brasa errante (Camino de la Amistad, aliada e intangible) y `RENEGADE` = Renegado
        (Camino de la Venganza, del lado de la mazmorra).
    PathKind:
      type: string
      enum: [FRIENDSHIP, VENGEANCE]
      description: '`FRIENDSHIP` = Camino de la Amistad (Brasa errante); `VENGEANCE` = Camino de la Venganza (Renegado). Desde 1.3.0.'
    MatchStatus:
      type: string
      enum: [LOBBY, DRAFTING, IN_PROGRESS, FINISHED, FAULTED, ABANDONED, EXPIRED, TERMINATED]
    BlessingId:
      type: string
      enum: [BRASA_VIVA, PASO_IGNEO, PUNO_DE_PIEDRA, CORAZON_DOBLE, HOJA_HAMBRIENTA, ESPEJO_ROTO, LAMPARA, GANZUA, ULTIMO_ALIENTO, CODICIA, ESCARCHA, OJO_DE_BUHO]
    EnemyKind:
      type: string
      enum: [CARRONERO, POLILLA, GELATINA, SALTASAPO, BALLESTERO, TOTEM, CELADOR]
    TileKind:
      type: string
      enum: [FLOOR, WALL, SPIKES, SPIKES_ARMED, BRAZIER, CRACK, CHEST, CHEST_OPENED, ALTAR, STAIRS, FIRE]
    Embers:
      type: integer
      minimum: 0
      maximum: 999
    Hp:
      type: integer
      minimum: 0
      maximum: 10

    # ───────────── Órdenes ─────────────
    Order:
      description: |
        Orden del jugador. `GUARD` no lleva dirección; el resto la exige.
        El cliente solo envía la intención: todo cálculo ocurre en el servidor.
      oneOf:
        - $ref: '#/components/schemas/DirectedOrder'
        - $ref: '#/components/schemas/GuardOrder'
    DirectedOrder:
      type: object
      additionalProperties: false
      required: [type, direction]
      properties:
        type:
          type: string
          enum: [MOVE, ATTACK, ABILITY, INTERACT]
        direction:
          $ref: '#/components/schemas/Direction'
    GuardOrder:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: GUARD
    NullableOrder:
      anyOf:
        - $ref: '#/components/schemas/Order'
        - type: 'null'

    # ───────────── Peticiones (cliente → servidor) ─────────────
    JoinMatchRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [matchId, round, clientActionId, order]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        clientActionId:
          $ref: '#/components/schemas/Uuid'
          description: UUID v7 generado por el cliente; clave de idempotencia.
        order:
          $ref: '#/components/schemas/Order'
    GetSnapshotRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    LeaveMatchRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    DraftPickRequest:
      type: object
      additionalProperties: false
      required: [matchId, offerId, blessingId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        blessingId:
          $ref: '#/components/schemas/BlessingId'
    ChoosePathRequest:
      type: object
      additionalProperties: false
      required: [matchId, offerId, path]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
          description: El de la `PathOffer` vigente (también en `me.path.offerId`).
        path:
          $ref: '#/components/schemas/PathKind'

    # ───────────── Respuestas (ACK) ─────────────
    JoinMatchAck:
      type: object
      additionalProperties: false
      required: [matchId, playerId, seat, snapshot]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        playerId:
          $ref: '#/components/schemas/Uuid'
        seat:
          type: integer
          minimum: 1
          maximum: 4
          description: Orden de asiento (desempata la iniciativa).
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    SubmitOrderAck:
      type: object
      additionalProperties: false
      required: [matchId, round, clientActionId, result, receivedAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        clientActionId:
          $ref: '#/components/schemas/Uuid'
        result:
          type: string
          enum: [ACCEPTED, DUPLICATE_ACTION]
          description: '`DUPLICATE_ACTION` = reenvío idempotente; se repite el ACK original.'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
    LeaveMatchAck:
      type: object
      additionalProperties: false
      required: [matchId, leftAt, abandoned]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        leftAt:
          $ref: '#/components/schemas/Timestamp'
        abandoned:
          type: boolean
          description: '`true` si la partida estaba en curso y la salida contó como abandono.'
    DraftPickAck:
      type: object
      additionalProperties: false
      required: [matchId, offerId, blessingId, acceptedAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        blessingId:
          $ref: '#/components/schemas/BlessingId'
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
    ChoosePathAck:
      type: object
      additionalProperties: false
      required: [matchId, offerId, path, result, acceptedAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        path:
          $ref: '#/components/schemas/PathKind'
        result:
          type: string
          enum: [ACCEPTED, DUPLICATE_ACTION]
          description: '`DUPLICATE_ACTION` = la misma elección repetida; se devuelve el ACK original.'
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'

    # ───────────── Errores ─────────────
    ErrorCode:
      type: string
      enum:
        - INVALID_PAYLOAD
        - INVALID_ORDER
        - STALE_ROUND
        - ORDER_ALREADY_SUBMITTED
        - ORDER_TOO_LATE
        - DUPLICATE_ACTION
        - NOT_PARTICIPANT
        - NOT_JOINED
        - PLAYER_DOWN
        - MATCH_NOT_FOUND
        - MATCH_NOT_ACTIVE
        - ALREADY_IN_ANOTHER_MATCH
        - DRAFT_CLOSED
        - INVALID_PICK
        - RATE_LIMITED
        - MESSAGE_TOO_LARGE
        - INTERNAL_ERROR
        - SESSION_REPLACED
        - KICKED_BY_ADMIN
        - PATH_CLOSED
      description: Código estable. Nunca cambia de significado; los nuevos se agregan en versiones menores.
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 200
          description: Texto para humanos (español). No se debe interpretar en el cliente.
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 60000
          description: Solo en errores reintentables.
        details:
          type: object
          additionalProperties: false
          maxProperties: 4
          properties:
            field:
              type: string
              maxLength: 64
              description: Ruta del campo que falló la validación.
            currentRound:
              $ref: '#/components/schemas/RoundNumber'
            status:
              $ref: '#/components/schemas/MatchStatus'
            traceId:
              type: string
              maxLength: 32
              pattern: '^[0-9a-f]{32}$'
              description: Id de traza de OpenTelemetry, para soporte.
    InvocationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorPush:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        error:
          $ref: '#/components/schemas/ErrorBody'
    CloseReason:
      type: string
      enum:
        - TICKET_INVALID
        - UNSUPPORTED_PROTOCOL_VERSION
        - CONNECTION_LIMIT
        - MATCH_FINISHED
        - SERVER_DRAINING
        - MESSAGE_TOO_LARGE
        - INTERNAL_ERROR
        - SESSION_REPLACED
        - KICKED_BY_ADMIN
        - RATE_LIMITED
        - HEARTBEAT_TIMEOUT
      description: Razón de cierre (ver la tabla de la sección 2). Va al inicio de `Close.error` de SignalR.

    # ───────────── Vista del jugador ─────────────
    Pact:
      type: object
      additionalProperties: false
      required: [pactId, description]
      properties:
        pactId:
          type: string
          enum: [FINAL_BLOW_WARDEN, NEVER_DOWNED, OPEN_3_CHESTS, REVIVE_2_ALLIES, BETRAY_TWICE_UNSEEN]
        description:
          type: string
          maxLength: 140
    NullablePact:
      anyOf:
        - $ref: '#/components/schemas/Pact'
        - type: 'null'
    SelfHero:
      type: object
      description: |
        El héroe propio, con toda su información privada (pacto, bendiciones, orden pendiente). El Avaro no tiene
        barra de vida: `hp` y `maxHp` son 1 mientras está en pie y lo que aguanta son sus `embers`.
      additionalProperties: false
      required: [playerId, displayName, hero, state, hp, maxHp, shield, position, facing, embers, abilityCooldown, downRoundsLeft, blessings, pact, decided, pendingOrder]
      properties:
        playerId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hero:
          $ref: '#/components/schemas/HeroKind'
        state:
          $ref: '#/components/schemas/HeroState'
        hp:
          $ref: '#/components/schemas/Hp'
        maxHp:
          type: integer
          minimum: 1
          maximum: 10
        shield:
          type: integer
          minimum: 0
          maximum: 10
        position:
          $ref: '#/components/schemas/Position'
        facing:
          $ref: '#/components/schemas/Direction'
        embers:
          $ref: '#/components/schemas/Embers'
        abilityCooldown:
          type: integer
          minimum: 0
          maximum: 12
          description: Rondas para volver a usar la habilidad (Avivar, para la Brasa). El Renegado tiene enfriamiento ×2; hasta 12 por girar al Celador como Polizón Renegado.
        secondBody:
          description: 'Hilván: su segundo cuerpo. `null` para los demás. Desde 2.0.0.'
          anyOf:
            - $ref: '#/components/schemas/Position'
            - type: 'null'
        hostEnemyId:
          description: 'Polizón: el enemigo en el que va (solo lo ve él); mientras tanto, `position` sigue al huésped. Desde 2.0.0.'
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100000
            - type: 'null'
        debt:
          type: integer
          minimum: 0
          maximum: 99
          description: Ascuas que debes a la Usurera; las ves tú y ella. Desde 2.0.0.
        debtTo:
          description: A quién le debes; `null` sin deuda. Desde 2.0.0.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        rewindTile:
          description: 'Anteayer: adónde saltaría Volver en la ronda abierta; `null` sin 2 rondas de historia. Desde 2.0.0.'
          anyOf:
            - $ref: '#/components/schemas/Position'
            - type: 'null'
        rewindHp:
          description: 'Anteayer: la vida que tenía allí. Desde 2.0.0.'
          anyOf:
            - $ref: '#/components/schemas/Hp'
            - type: 'null'
        downRoundsLeft:
          description: Rondas que faltan para extinguirse si está caído; `null` si no lo está.
          anyOf:
            - type: integer
              minimum: 0
              maximum: 3
            - type: 'null'
        blessings:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BlessingId'
        pact:
          $ref: '#/components/schemas/NullablePact'
        decided:
          type: boolean
          description: Si ya envió su orden en la ronda abierta.
        pendingOrder:
          $ref: '#/components/schemas/NullableOrder'
        path:
          description: Caminos tras la extinción (privado). `null` si nunca se extinguió. Desde 1.3.0.
          anyOf:
            - $ref: '#/components/schemas/SelfPath'
            - type: 'null'
    SelfPath:
      type: object
      description: |
        Lo privado de los caminos; solo lo recibe su dueño. Desde 1.3.0.
      additionalProperties: false
      required: [offerId, choice, savedEmbers, echoes, rebirthEmbers, hinderCooldown, awaitingSpawn, spawnRound]
      properties:
        offerId:
          description: Oferta abierta (hay que llamar a `ChoosePath`); `null` si no hay que elegir.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        choice:
          description: Camino elegido y aún no revelado; `null` si no eligió o ya se reveló.
          anyOf:
            - $ref: '#/components/schemas/PathKind'
            - type: 'null'
        savedEmbers:
          $ref: '#/components/schemas/Embers'
          description: Ascuas guardadas al extinguirse.
        echoes:
          type: integer
          minimum: 0
          maximum: 99
          description: Ecos ganados como Brasa errante.
        rebirthEmbers:
          description: 'Brasa: ascuas con las que renacería ahora, ⌈guardadas × (25% + 8% × ecos)⌉ con tope 85%; si no es Brasa, `null`.'
          anyOf:
            - $ref: '#/components/schemas/Embers'
            - type: 'null'
        hinderCooldown:
          type: integer
          minimum: 0
          maximum: 2
          description: 'Brasa: rondas para volver a usar Estorbo (`ATTACK`). El de Avivar es `abilityCooldown`.'
        awaitingSpawn:
          description: 'Renegado que aún no apareció: `NEXT_FLOOR` (al bajar de piso) o `ROUND` (sala del Celador, en `spawnRound`); si no, `null`.'
          anyOf:
            - type: string
              enum: [NEXT_FLOOR, ROUND]
            - type: 'null'
        spawnRound:
          description: Ronda en la que reaparece el Renegado en la sala del Celador; si no, `null`.
          anyOf:
            - $ref: '#/components/schemas/RoundNumber'
            - type: 'null'
    OtherHero:
      type: object
      description: |
        Otro portador, tal como lo ve este jugador. `position` y `facing` son `null` si va dentro de un huésped
        (Polizón) o, para La Escucha, si no está a su alcance ni hizo ruido. Nunca incluye pacto, bendiciones
        concretas, orden pendiente ni huésped. Desde 1.3.0: una Brasa
        (`EMBER_SPIRIT`) se ve siempre si eres del grupo; un `RENEGADE` (o, para un Renegado, un héroe) solo
        trae posición dentro de la visión; un extinto o un Renegado que aún no apareció no tiene posición.
        Nunca incluye ecos, ascuas guardadas ni el camino elegido sin revelar.
      additionalProperties: false
      required: [playerId, displayName, hero, state, hp, maxHp, position, facing, embers, blessingCount, connected, decided]
      properties:
        playerId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hero:
          $ref: '#/components/schemas/HeroKind'
        state:
          $ref: '#/components/schemas/HeroState'
        hp:
          $ref: '#/components/schemas/Hp'
        maxHp:
          type: integer
          minimum: 1
          maximum: 10
        position:
          $ref: '#/components/schemas/NullablePosition'
        facing:
          anyOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        embers:
          $ref: '#/components/schemas/Embers'
        blessingCount:
          type: integer
          minimum: 0
          maximum: 12
        connected:
          type: boolean
        decided:
          type: boolean
        secondBody:
          description: 'Hilván: su segundo cuerpo, con la misma regla de visibilidad que `position`. Desde 2.0.0.'
          anyOf:
            - $ref: '#/components/schemas/Position'
            - type: 'null'
        debtToYou:
          description: Lo que te debe este jugador; solo si eres la Usurera a la que le debe. Desde 2.0.0.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 99
            - type: 'null'
    Echo:
      type: object
      description: Un Eco de Anteayer. Lo ve quien tenga esa casilla en su visión (el próximo de cada Anteayer); ella ve todos los suyos.
      additionalProperties: false
      required: [ownerId, position, direction, fireRound]
      properties:
        ownerId:
          $ref: '#/components/schemas/Uuid'
        position:
          $ref: '#/components/schemas/Position'
        direction:
          $ref: '#/components/schemas/Direction'
        fireRound:
          $ref: '#/components/schemas/RoundNumber'
    GroundEmbers:
      type: object
      description: Ascuas en el suelo en una casilla visible. Las recoge el primero que la pise; se pierden al cambiar de sala.
      additionalProperties: false
      required: [position, amount]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        amount:
          type: integer
          minimum: 1
          maximum: 99
    Bell:
      type: object
      description: Repique sonando en la ronda abierta. Es público; se oye.
      additionalProperties: false
      required: [ringerId, deadline, closed]
      properties:
        ringerId:
          $ref: '#/components/schemas/Uuid'
        deadline:
          description: Hasta cuándo pueden decidir los demás; `null` si ya venció.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
        closed:
          type: boolean
          description: Ya venció el plazo reducido.
    Enemy:
      type: object
      description: Enemigo dentro de la visión del jugador. `telegraph` son las casillas que golpeará en la ronda siguiente.
      additionalProperties: false
      required: [enemyId, kind, hp, maxHp, position, facing, phase, telegraph]
      properties:
        enemyId:
          type: integer
          minimum: 1
          maximum: 100000
        kind:
          $ref: '#/components/schemas/EnemyKind'
        hp:
          type: integer
          minimum: 0
          maximum: 64
        maxHp:
          type: integer
          minimum: 1
          maximum: 64
        position:
          $ref: '#/components/schemas/Position'
        facing:
          anyOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        phase:
          description: Fase del Celador (1 o 2); `null` para el resto.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 2
            - type: 'null'
        telegraph:
          type: array
          maxItems: 17
          items:
            $ref: '#/components/schemas/Position'
    Tile:
      type: object
      additionalProperties: false
      required: [x, y, kind]
      properties:
        x: { type: integer, minimum: 0, maximum: 8 }
        y: { type: integer, minimum: 0, maximum: 8 }
        kind:
          $ref: '#/components/schemas/TileKind'
    VisibleEvent:
      type: object
      description: |
        Evento de la ronda que este jugador pudo ver. `type` es **extensible**: los clientes deben
        ignorar tipos desconocidos. `actorId`/`targetId` son un `playerId` o `enemy:{enemyId}`.

        Tipos de los caminos (desde 1.3.0; los marcados *privado* solo los recibe `actorId`):

        | `type` | Campos | Significado |
        |---|---|---|
        | `PATH_OFFERED` *privado* | `actorId`, `amount` = ascuas guardadas | Se abrió tu elección (llega también `PathOffer`) |
        | `PATH_SELECTED` *privado* | `actorId`, `detail` = `FRIENDSHIP`/`VENGEANCE` (`_AUTO` si venció el plazo) | Tu elección quedó registrada |
        | `PATH_CHOSEN` | `actorId`, `detail` = camino | Al resolver la ronda, todos ven el camino |
        | `EMBER_REBORN` | `actorId`, `position`, `amount` = vida | La Brasa renació al bajar de piso |
        | `RENEGADE_SPAWNED` | `actorId`, `position` (solo si lo ves) | Apareció un Renegado; cada héroe activo ganó +1 de escudo |
        | `RENEGADE_DEFEATED` | `actorId` = quien lo derrotó (si hubo), `targetId` = Renegado | Derrotaron a un Renegado (+2 ascuas al autor) |
        | `ECHO_GAINED` *privado* | `actorId`, `amount`, `detail` = `SHIELD_ABSORBED`/`REKINDLED`/`ATTACK_HINDERED`/`BEACON_KILL`/`WARMTH` | La Brasa ganó ecos |
        | `SHIELD_KINDLED` | `actorId` = Brasa, `targetId` = aliado (sin `targetId` si no hubo a quién) | Avivar |
        | `ATTACK_HINDERED` | `actorId` = Brasa, `targetId` = `enemy:{id}` (sin él si no funcionó) | Estorbo |
        | `BEACON_LIT` | `actorId`, `position` | Faro |
        | `WARMTH_HEALED` | `actorId` = Brasa, `targetId` = aliado | Calidez (llega también `HEALED`) |

        Reavivar se informa como `REVIVED` (con `actorId` = la Brasa) y la Deriva como `MOVED`. El primer golpe
        de un Renegado a cada héroe llega como `BLOCKED` con `detail: WARNING_SHIELD`.

        Tipos de los héroes (desde 2.0.0; los marcados *privado* solo los reciben los implicados):

        | `type` | Campos | Significado |
        |---|---|---|
        | `MOVED`, `BOUNCED` | `detail: SECOND_BODY` | Es el segundo cuerpo de Hilván |
        | `ECHO_FIRED` | `actorId` = Anteayer, `position` = de dónde sale, `detail` = dirección | Disparó un Eco |
        | `ATTACK_CORRECTED` | `targetId` = `enemy:{id}` (solo si lo ves), `tiles` = casillas que ves | Un anuncio se desvió; no dice quién fue |
        | `BETRAYAL_RECORDED` *privado* | `actorId` = traidor, `targetId` = víctima, `amount` = daño | Solo lo ve quien la cometió |
        | `BETRAYAL_REVEALED` | `actorId`, `targetId`, `amount` | Al terminar, sumadas por traidor y víctima |
        | `HOST_BOARDED` *privado* | `actorId`, `targetId` = `enemy:{id}` | Polizón entró |
        | `HOST_EXITED` | `actorId`, `position` | Polizón reapareció (lo ve quien vea la casilla) |
        | `HOST_DRAINED` *privado* | `actorId`, `targetId` = `enemy:{id}` | Drenó a su huésped |
        | `WARDEN_TURNED` | `targetId` = `enemy:{id}`, `detail` = hacia dónde mira | Abordar giró al Celador |
        | `SHOUTED` | `actorId` | Grito de La Escucha |
        | `DEBT_CHANGED` *privado* | `actorId` = Usurera, `targetId` = deudor, `amount` = cambio, `detail` = `LOAN`/`INTEREST`/`PAID`/`EXTINCTION`/`MATCH_END`/`CANCELLED` | Solo para ellos dos |
        | `EMBERS_DROPPED` | `position`, `amount` | Cayeron ascuas al suelo |
        | `EMBERS_PICKED_UP` | `actorId`, `position`, `amount` | Alguien las recogió |
        | `EMBERS_LOST` *privado* | `actorId`, `amount` negativo, `detail` = `HIT`/`BRIBE`/`DEBT_SETTLED` | Tus ascuas bajaron |
        | `ENEMY_BRIBED` | `actorId` = Avaro, `targetId` = `enemy:{id}`, `amount` = pago | Soborno |
        | `ROOM_SHIFTED` | `actorId`, `amount` = línea, `detail` = `ROW_E`/`ROW_W`/`COLUMN_N`/`COLUMN_S` | Corrimiento; lo ven todos |
        | `BELL_RUNG` | `actorId`, `amount` = ronda en que suena | Repique |
        | `BELL_EXPIRED` | `actorId` = quien lo tocó | Venció el plazo reducido |

        `EMBERS_GAINED` puede traer `detail: DEBT_COLLECTED`. `ENEMY_KILLED` no trae `actorId` si el golpe final fue
        anónimo y no es tuyo (desviado por Errata o desde un huésped).
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [MOVED, BOUNCED, ATTACKED, DAMAGED, BLOCKED, HEALED, DOWNED, REVIVED, EXTINGUISHED, ENEMY_KILLED, ENEMY_SPAWNED, CHEST_OPENED, EMBERS_GAINED, EMBERS_STOLEN, BLESSING_GAINED, TRAP_TRIGGERED, FIRE_STARTED, FROZEN, BOSS_PHASE_CHANGED, FLOOR_ENTERED, DEFAULT_GUARD_APPLIED, ABILITY_USED, GUARDED, PATH_OFFERED, PATH_SELECTED, PATH_CHOSEN, EMBER_REBORN, RENEGADE_SPAWNED, RENEGADE_DEFEATED, ECHO_GAINED, SHIELD_KINDLED, ATTACK_HINDERED, BEACON_LIT, WARMTH_HEALED, ECHO_FIRED, ATTACK_CORRECTED, BETRAYAL_RECORDED, BETRAYAL_REVEALED, HOST_BOARDED, HOST_EXITED, HOST_DRAINED, WARDEN_TURNED, SHOUTED, DEBT_CHANGED, EMBERS_DROPPED, EMBERS_PICKED_UP, EMBERS_LOST, ENEMY_BRIBED, ROOM_SHIFTED, BELL_RUNG, BELL_EXPIRED]
        detail:
          type: string
          maxLength: 32
          description: Dato extra del evento (desde 1.3.0), p. ej. el camino en `PATH_CHOSEN`. Extensible.
        actorId:
          type: string
          maxLength: 36
        targetId:
          type: string
          maxLength: 36
        position:
          $ref: '#/components/schemas/Position'
        amount:
          type: integer
          minimum: -99
          maximum: 99
        tiles:
          type: array
          maxItems: 81
          description: Casillas del evento (`ATTACK_CORRECTED`). Desde 2.0.0.
          items:
            $ref: '#/components/schemas/Position'
    PlayerView:
      type: object
      description: Vista completa del jugador; la genera `PlayerViewProjector` y no contiene secretos ajenos.
      additionalProperties: false
      required: [status, round, floor, roundDeadline, me, allies, enemies, tiles]
      properties:
        status:
          $ref: '#/components/schemas/MatchStatus'
        round:
          type: integer
          minimum: 0
          maximum: 60
          description: Ronda actual; 0 antes de la primera.
        floor:
          type: integer
          minimum: 1
          maximum: 5
        roundDeadline:
          description: Plazo de este jugador en la ronda abierta. Con el Repique, el de los demás es menor que el de quien lo tocó.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
        me:
          $ref: '#/components/schemas/SelfHero'
        allies:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OtherHero'
        enemies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Enemy'
        tiles:
          type: array
          maxItems: 81
          description: Solo las casillas visibles para el jugador. La Escucha conoce el terreno de toda la sala.
          items:
            $ref: '#/components/schemas/Tile'
        hiddenTelegraphs:
          type: array
          maxItems: 81
          description: Casillas anunciadas por enemigos que no ves (Errata y Ojo de búho), sin autor. Desde 2.0.0.
          items:
            $ref: '#/components/schemas/Position'
        echoes:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/Echo'
        groundEmbers:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/GroundEmbers'
        noiseTiles:
          type: array
          maxItems: 81
          description: 'La Escucha: casillas donde oyó ruido en la última resolución. Vacío para los demás. Desde 2.0.0.'
          items:
            $ref: '#/components/schemas/Position'
        bell:
          description: Repique sonando en la ronda abierta; `null` si no. Desde 2.0.0.
          anyOf:
            - $ref: '#/components/schemas/Bell'
            - type: 'null'
    PlayerViewDelta:
      type: object
      description: |
        Cambios de la vista desde `previousSeq`. Las listas ausentes significan "sin cambios".
        Un enemigo que sale de la visión aparece en `enemiesRemoved`. `hiddenTelegraphs`, `echoes`,
        `groundEmbers` y `noiseTiles` son listas completas: reemplazan a las anteriores.
      additionalProperties: false
      required: [status, me, events]
      properties:
        status:
          $ref: '#/components/schemas/MatchStatus'
        floorChanged:
          description: Nueva sala si el grupo bajó de piso (el cliente descarta sus casillas); si no, `null`.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: 'null'
        me:
          $ref: '#/components/schemas/SelfHero'
        alliesChanged:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OtherHero'
        enemiesUpserted:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Enemy'
        enemiesRemoved:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 100000
        tilesChanged:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/Tile'
        events:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/VisibleEvent'
        hiddenTelegraphs:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/Position'
        echoes:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/Echo'
        groundEmbers:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/GroundEmbers'
        noiseTiles:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/Position'
        bell:
          anyOf:
            - $ref: '#/components/schemas/Bell'
            - type: 'null'
        roundDeadline:
          description: Plazo de este jugador en la ronda que abre; con el Repique puede ser menor que el de los demás. Desde 2.0.0.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
    RevealedPact:
      type: object
      additionalProperties: false
      required: [pactId, description, fulfilled]
      properties:
        pactId:
          type: string
          enum: [FINAL_BLOW_WARDEN, NEVER_DOWNED, OPEN_3_CHESTS, REVIVE_2_ALLIES, BETRAY_TWICE_UNSEEN]
        description:
          type: string
          maxLength: 140
        fulfilled:
          type: boolean

    # ───────────── Mensajes servidor → cliente ─────────────
    RoundOpened:
      type: object
      additionalProperties: false
      required: [matchId, round, deadline, durationMs, expectedPlayers]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        deadline:
          $ref: '#/components/schemas/Timestamp'
        durationMs:
          type: integer
          minimum: 1000
          maximum: 60000
          description: Duración de la planificación (20 000 por defecto); útil si el reloj del cliente difiere.
        expectedPlayers:
          type: integer
          minimum: 1
          maximum: 4
          description: Jugadores de los que se espera orden (héroes activos y, desde 1.3.0, Brasas y Renegados presentes).
        bellDeadline:
          description: Con Repique, hasta cuándo pueden decidir todos menos `bellRingerId`; si no, `null`. Desde 2.0.0.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
        bellRingerId:
          description: Quien tocó el Repique; conserva todo el reloj. Desde 2.0.0.
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    PlayerDecided:
      type: object
      additionalProperties: false
      required: [matchId, round, playerId, decidedCount, expectedPlayers]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        playerId:
          $ref: '#/components/schemas/Uuid'
        decidedCount:
          type: integer
          minimum: 1
          maximum: 4
        expectedPlayers:
          type: integer
          minimum: 1
          maximum: 4
    RoundResolved:
      type: object
      additionalProperties: false
      required: [matchId, round, previousSeq, seq, delta]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        previousSeq:
          $ref: '#/components/schemas/Seq'
        seq:
          $ref: '#/components/schemas/Seq'
        delta:
          $ref: '#/components/schemas/PlayerViewDelta'
    Snapshot:
      type: object
      additionalProperties: false
      required: [matchId, seq, serverTime, view]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        seq:
          $ref: '#/components/schemas/Seq'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        view:
          $ref: '#/components/schemas/PlayerView'
    DraftOffer:
      type: object
      additionalProperties: false
      required: [matchId, offerId, source, options, deadline]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        source:
          type: string
          enum: [INITIAL_DRAFT, ALTAR]
        options:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BlessingId'
        deadline:
          $ref: '#/components/schemas/Timestamp'
    PathOffer:
      type: object
      additionalProperties: false
      required: [matchId, offerId, options, defaultPath, deadline, savedEmbers, vengeanceEmbers, friendshipEmbersMin, friendshipEmbersMax, wardenRoom]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        options:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PathKind'
        defaultPath:
          $ref: '#/components/schemas/PathKind'
          description: Lo que elige el servidor si vence el plazo (siempre `FRIENDSHIP`).
        deadline:
          $ref: '#/components/schemas/Timestamp'
          description: Fin del plazo (15 s desde que abrió la ronda, nunca después del cierre de la ronda).
        savedEmbers:
          $ref: '#/components/schemas/Embers'
        vengeanceEmbers:
          $ref: '#/components/schemas/Embers'
          description: Ascuas con las que vuelve como Renegado, ⌈guardadas / 2⌉.
        friendshipEmbersMin:
          $ref: '#/components/schemas/Embers'
          description: Ascuas al renacer como Brasa sin ecos (25%).
        friendshipEmbersMax:
          $ref: '#/components/schemas/Embers'
          description: Ascuas al renacer como Brasa con el tope (85%, desde 8 ecos).
        wardenRoom:
          type: boolean
          description: En la sala del Celador la Brasa no renace (puntúa con la fórmula al final) y el Renegado aparece 2 rondas después junto al Celador.
    HeardOrder:
      type: object
      description: Una orden que oye el Campanero. Como Renegado, sin dirección.
      additionalProperties: false
      required: [playerId, type, direction]
      properties:
        playerId:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [MOVE, ATTACK, ABILITY, INTERACT, GUARD]
        direction:
          anyOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
    LastWord:
      type: object
      additionalProperties: false
      required: [matchId, round, orders, typesOnly]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        orders:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/HeardOrder'
        typesOnly:
          type: boolean
          description: Como Renegado solo se oyen los tipos.
    SignalKind:
      type: string
      enum: [HERE, DANGER, HELP, MINE]
      description: «¡Aquí!», «¡Cuidado!», «Ayuda» y «Es mía».
    SendSignalRequest:
      type: object
      additionalProperties: false
      required: [matchId, kind]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SignalKind'
        position:
          description: Casilla marcada (opcional). Debe estar en el tablero; puede ser mentira.
          anyOf:
            - $ref: '#/components/schemas/Position'
            - type: 'null'
    SendSignalAck:
      type: object
      additionalProperties: false
      required: [matchId, sentAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    SignalReceived:
      type: object
      additionalProperties: false
      required: [matchId, fromPlayerId, kind, position, sentAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        fromPlayerId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/SignalKind'
        position:
          anyOf:
            - $ref: '#/components/schemas/Position'
            - type: 'null'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
    PlayerConnectionChanged:
      type: object
      additionalProperties: false
      required: [matchId, playerId, state, graceDeadline]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        playerId:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum: [CONNECTED, DISCONNECTED, ABANDONED]
        graceDeadline:
          description: Fin de la gracia de reconexión si está `DISCONNECTED`; si no, `null`.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
    MatchFinished:
      type: object
      additionalProperties: false
      required: [matchId, seq, outcome, rounds, winners, standings, finishedAt, replayUrl]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        seq:
          $ref: '#/components/schemas/Seq'
        outcome:
          type: string
          enum: [WARDEN_DEFEATED, DRAW, EMBER_EXTINGUISHED, ABANDONED, FAULTED, TERMINATED, THRESHOLD_CLAIMED]
          description: |
            `WARDEN_DEFEATED` = cayó el Celador con un ganador; `DRAW` = cayó con empate en ascuas;
            `EMBER_EXTINGUISHED` = derrota colectiva (todos caídos o 60 rondas);
            `THRESHOLD_CLAIMED` = «El Umbral reclama» (desde 1.3.0): todos los héroes caídos o extintos con
            Renegados en pie; `winners` son los Renegados con más ascuas (puede haber empate);
            `ABANDONED` = quedaron menos de 1 humano activo; `FAULTED` = error aislado del servidor;
            `TERMINATED` = un administrador detuvo la partida (sin ganadores; pactos sin revelar).
        rounds:
          type: integer
          minimum: 0
          maximum: 60
        winners:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        standings:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [playerId, displayName, hero, finalState, embers, placement, pact]
            properties:
              playerId:
                $ref: '#/components/schemas/Uuid'
              displayName:
                $ref: '#/components/schemas/DisplayName'
              hero:
                $ref: '#/components/schemas/HeroKind'
              finalState:
                $ref: '#/components/schemas/HeroState'
              embers:
                $ref: '#/components/schemas/Embers'
              placement:
                type: integer
                minimum: 1
                maximum: 4
              pact:
                anyOf:
                  - $ref: '#/components/schemas/RevealedPact'
                  - type: 'null'
        finishedAt:
          $ref: '#/components/schemas/Timestamp'
        replayUrl:
          type: string
          format: uri
          maxLength: 256
        betrayals:
          type: array
          maxItems: 12
          description: Traiciones anónimas, sumadas por traidor y víctima. Siempre llega; vacía si no hubo. Desde 2.0.0.
          items:
            type: object
            additionalProperties: false
            required: [traitorId, victimId, damage]
            properties:
              traitorId:
                $ref: '#/components/schemas/Uuid'
              victimId:
                $ref: '#/components/schemas/Uuid'
              damage:
                type: integer
                minimum: 1
                maximum: 999
    ServerDraining:
      type: object
      additionalProperties: false
      required: [reason, reconnectAfterMs, closesAt]
      properties:
        reason:
          type: string
          enum: [DEPLOYMENT, SCALE_IN, SHUTDOWN]
        reconnectAfterMs:
          type: integer
          minimum: 0
          maximum: 10000
          description: Espera sugerida (con *jitter*) antes de reconectar, para no saturar a las otras réplicas.
        closesAt:
          $ref: '#/components/schemas/Timestamp'
