  schemas:
    # ───────────── Tipos base ─────────────
    Uuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Timestamp:
      type: string
      format: date-time
      maxLength: 35
      description: Instante UTC (RFC 3339) según el reloj del servidor.
    NullableTimestamp:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    RoundNumber:
      type: integer
      minimum: 1
      maximum: 60
      description: Número de ronda (máximo 60; al agotarse, el Umbral se apaga).
    Seq:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Secuencia monótona de eventos de la partida.
    Direction:
      type: string
      enum: [N, S, E, W]
    Position:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0, maximum: 8 }
        y: { type: integer, minimum: 0, maximum: 8 }
    NullablePosition:
      anyOf:
        - $ref: '#/components/schemas/Position'
        - type: 'null'
    DisplayName:
      type: string
      minLength: 3
      maxLength: 32
    HeroKind:
      type: string
      enum: [YUNQUE, CHISPA, CUERVO, RAIZ]
    HeroState:
      type: string
      enum: [ALIVE, DOWN, EXTINCT, RETIRED]
      description: '`DOWN` = caído; `EXTINCT` = extinto; `RETIRED` = abandonó.'
    MatchStatus:
      type: string
      enum: [LOBBY, DRAFTING, IN_PROGRESS, FINISHED, FAULTED, ABANDONED, EXPIRED]
    BlessingId:
      type: string
      enum: [BRASA_VIVA, PASO_IGNEO, PUNO_DE_PIEDRA, CORAZON_DOBLE, HOJA_HAMBRIENTA, ESPEJO_ROTO, LAMPARA, GANZUA, ULTIMO_ALIENTO, CODICIA, ESCARCHA, OJO_DE_BUHO]
    EnemyKind:
      type: string
      enum: [CARRONERO, POLILLA, GELATINA, SALTASAPO, BALLESTERO, TOTEM, CELADOR]
    TileKind:
      type: string
      enum: [FLOOR, WALL, SPIKES, SPIKES_ARMED, BRAZIER, CRACK, CHEST, CHEST_OPENED, ALTAR, STAIRS, FIRE]
    Embers:
      type: integer
      minimum: 0
      maximum: 999
    Hp:
      type: integer
      minimum: 0
      maximum: 8

    # ───────────── Órdenes ─────────────
    Order:
      description: |
        Orden del jugador. `GUARD` no lleva dirección; el resto la exige.
        El cliente solo envía la intención: todo cálculo ocurre en el servidor.
      oneOf:
        - $ref: '#/components/schemas/DirectedOrder'
        - $ref: '#/components/schemas/GuardOrder'
    DirectedOrder:
      type: object
      additionalProperties: false
      required: [type, direction]
      properties:
        type:
          type: string
          enum: [MOVE, ATTACK, ABILITY, INTERACT]
        direction:
          $ref: '#/components/schemas/Direction'
    GuardOrder:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: GUARD
    NullableOrder:
      anyOf:
        - $ref: '#/components/schemas/Order'
        - type: 'null'

    # ───────────── Peticiones (cliente → servidor) ─────────────
    JoinMatchRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [matchId, round, clientActionId, order]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        clientActionId:
          $ref: '#/components/schemas/Uuid'
          description: UUID v7 generado por el cliente; clave de idempotencia.
        order:
          $ref: '#/components/schemas/Order'
    GetSnapshotRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    LeaveMatchRequest:
      type: object
      additionalProperties: false
      required: [matchId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
    DraftPickRequest:
      type: object
      additionalProperties: false
      required: [matchId, offerId, blessingId]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        blessingId:
          $ref: '#/components/schemas/BlessingId'

    # ───────────── Respuestas (ACK) ─────────────
    JoinMatchAck:
      type: object
      additionalProperties: false
      required: [matchId, playerId, seat, snapshot]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        playerId:
          $ref: '#/components/schemas/Uuid'
        seat:
          type: integer
          minimum: 1
          maximum: 4
          description: Orden de asiento (desempata la iniciativa).
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    SubmitOrderAck:
      type: object
      additionalProperties: false
      required: [matchId, round, clientActionId, result, receivedAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        clientActionId:
          $ref: '#/components/schemas/Uuid'
        result:
          type: string
          enum: [ACCEPTED, DUPLICATE_ACTION]
          description: '`DUPLICATE_ACTION` = reenvío idempotente; se repite el ACK original.'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
    LeaveMatchAck:
      type: object
      additionalProperties: false
      required: [matchId, leftAt, abandoned]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        leftAt:
          $ref: '#/components/schemas/Timestamp'
        abandoned:
          type: boolean
          description: '`true` si la partida estaba en curso y la salida contó como abandono.'
    DraftPickAck:
      type: object
      additionalProperties: false
      required: [matchId, offerId, blessingId, acceptedAt]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        blessingId:
          $ref: '#/components/schemas/BlessingId'
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'

    # ───────────── Errores ─────────────
    ErrorCode:
      type: string
      enum:
        - INVALID_PAYLOAD
        - INVALID_ORDER
        - STALE_ROUND
        - ORDER_ALREADY_SUBMITTED
        - DUPLICATE_ACTION
        - NOT_PARTICIPANT
        - NOT_JOINED
        - PLAYER_DOWN
        - MATCH_NOT_FOUND
        - MATCH_NOT_ACTIVE
        - ALREADY_IN_ANOTHER_MATCH
        - DRAFT_CLOSED
        - INVALID_PICK
        - RATE_LIMITED
        - MESSAGE_TOO_LARGE
        - INTERNAL_ERROR
      description: Código estable. Nunca cambia de significado; los nuevos se agregan en versiones menores.
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 200
          description: Texto para humanos (español). No se debe interpretar en el cliente.
        retryAfterMs:
          type: integer
          minimum: 0
          maximum: 60000
          description: Solo en errores reintentables.
        details:
          type: object
          additionalProperties: false
          maxProperties: 4
          properties:
            field:
              type: string
              maxLength: 64
              description: Ruta del campo que falló la validación.
            currentRound:
              $ref: '#/components/schemas/RoundNumber'
            status:
              $ref: '#/components/schemas/MatchStatus'
            traceId:
              type: string
              maxLength: 32
              pattern: '^[0-9a-f]{32}$'
              description: Id de traza de OpenTelemetry, para soporte.
    InvocationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorPush:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        error:
          $ref: '#/components/schemas/ErrorBody'
    CloseReason:
      type: string
      enum:
        - TICKET_INVALID
        - UNSUPPORTED_PROTOCOL_VERSION
        - CONNECTION_LIMIT
        - MATCH_FINISHED
        - SERVER_DRAINING
        - MESSAGE_TOO_LARGE
        - INTERNAL_ERROR
        - SESSION_REPLACED
        - KICKED_BY_ADMIN
        - RATE_LIMITED
        - HEARTBEAT_TIMEOUT
      description: Razón de cierre (ver la tabla de la sección 2). Va al inicio de `Close.error` de SignalR.

    # ───────────── Vista del jugador ─────────────
    Pact:
      type: object
      additionalProperties: false
      required: [pactId, description]
      properties:
        pactId:
          type: string
          enum: [FINAL_BLOW_WARDEN, NEVER_DOWNED, OPEN_3_CHESTS, REVIVE_2_ALLIES, BETRAY_TWICE_UNSEEN]
        description:
          type: string
          maxLength: 140
    NullablePact:
      anyOf:
        - $ref: '#/components/schemas/Pact'
        - type: 'null'
    SelfHero:
      type: object
      description: El héroe propio, con toda su información privada (pacto, bendiciones, orden pendiente).
      additionalProperties: false
      required: [playerId, displayName, hero, state, hp, maxHp, shield, position, facing, embers, charges, abilityCooldown, stealthRoundsLeft, downRoundsLeft, blessings, pact, decided, pendingOrder]
      properties:
        playerId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hero:
          $ref: '#/components/schemas/HeroKind'
        state:
          $ref: '#/components/schemas/HeroState'
        hp:
          $ref: '#/components/schemas/Hp'
        maxHp:
          type: integer
          minimum: 1
          maximum: 8
        shield:
          type: integer
          minimum: 0
          maximum: 10
        position:
          $ref: '#/components/schemas/Position'
        facing:
          $ref: '#/components/schemas/Direction'
        embers:
          $ref: '#/components/schemas/Embers'
        charges:
          type: integer
          minimum: 0
          maximum: 3
          description: Cargas de Chispa; 0 para los demás héroes.
        abilityCooldown:
          type: integer
          minimum: 0
          maximum: 4
        stealthRoundsLeft:
          type: integer
          minimum: 0
          maximum: 2
        downRoundsLeft:
          description: Rondas que faltan para extinguirse si está caído; `null` si no lo está.
          anyOf:
            - type: integer
              minimum: 0
              maximum: 3
            - type: 'null'
        blessings:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BlessingId'
        pact:
          $ref: '#/components/schemas/NullablePact'
        decided:
          type: boolean
          description: Si ya envió su orden en la ronda abierta.
        pendingOrder:
          $ref: '#/components/schemas/NullableOrder'
    OtherHero:
      type: object
      description: |
        Otro portador, tal como lo ve este jugador. `position` y `facing` son `null` si está en
        sigilo. Nunca incluye pacto, bendiciones concretas ni orden pendiente.
      additionalProperties: false
      required: [playerId, displayName, hero, state, hp, maxHp, position, facing, embers, blessingCount, connected, decided]
      properties:
        playerId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        hero:
          $ref: '#/components/schemas/HeroKind'
        state:
          $ref: '#/components/schemas/HeroState'
        hp:
          $ref: '#/components/schemas/Hp'
        maxHp:
          type: integer
          minimum: 1
          maximum: 8
        position:
          $ref: '#/components/schemas/NullablePosition'
        facing:
          anyOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        embers:
          $ref: '#/components/schemas/Embers'
        blessingCount:
          type: integer
          minimum: 0
          maximum: 12
        connected:
          type: boolean
        decided:
          type: boolean
    Enemy:
      type: object
      description: Enemigo dentro de la visión del jugador. `telegraph` son las casillas que golpeará en la ronda siguiente.
      additionalProperties: false
      required: [enemyId, kind, hp, maxHp, position, facing, phase, telegraph]
      properties:
        enemyId:
          type: integer
          minimum: 1
          maximum: 100000
        kind:
          $ref: '#/components/schemas/EnemyKind'
        hp:
          type: integer
          minimum: 0
          maximum: 64
        maxHp:
          type: integer
          minimum: 1
          maximum: 64
        position:
          $ref: '#/components/schemas/Position'
        facing:
          anyOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        phase:
          description: Fase del Celador (1 o 2); `null` para el resto.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 2
            - type: 'null'
        telegraph:
          type: array
          maxItems: 17
          items:
            $ref: '#/components/schemas/Position'
    Tile:
      type: object
      additionalProperties: false
      required: [x, y, kind]
      properties:
        x: { type: integer, minimum: 0, maximum: 8 }
        y: { type: integer, minimum: 0, maximum: 8 }
        kind:
          $ref: '#/components/schemas/TileKind'
    VisibleEvent:
      type: object
      description: |
        Evento de la ronda que este jugador pudo ver. `type` es **extensible**: los clientes deben
        ignorar tipos desconocidos. `actorId`/`targetId` son un `playerId` o `enemy:{enemyId}`.
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [MOVED, BOUNCED, ATTACKED, DAMAGED, BLOCKED, HEALED, DOWNED, REVIVED, EXTINGUISHED, ENEMY_KILLED, ENEMY_SPAWNED, CHEST_OPENED, EMBERS_GAINED, EMBERS_STOLEN, BLESSING_GAINED, TRAP_TRIGGERED, FIRE_STARTED, FROZEN, BOSS_PHASE_CHANGED, FLOOR_ENTERED, DEFAULT_GUARD_APPLIED]
        actorId:
          type: string
          maxLength: 36
        targetId:
          type: string
          maxLength: 36
        position:
          $ref: '#/components/schemas/Position'
        amount:
          type: integer
          minimum: -99
          maximum: 99
    PlayerView:
      type: object
      description: Vista completa del jugador; la genera `PlayerViewProjector` y no contiene secretos ajenos.
      additionalProperties: false
      required: [status, round, floor, roundDeadline, me, allies, enemies, tiles]
      properties:
        status:
          $ref: '#/components/schemas/MatchStatus'
        round:
          type: integer
          minimum: 0
          maximum: 60
          description: Ronda actual; 0 antes de la primera.
        floor:
          type: integer
          minimum: 1
          maximum: 5
        roundDeadline:
          $ref: '#/components/schemas/NullableTimestamp'
        me:
          $ref: '#/components/schemas/SelfHero'
        allies:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OtherHero'
        enemies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Enemy'
        tiles:
          type: array
          maxItems: 81
          description: Solo las casillas visibles o recordadas por el jugador.
          items:
            $ref: '#/components/schemas/Tile'
    PlayerViewDelta:
      type: object
      description: |
        Cambios de la vista desde `previousSeq`. Las listas ausentes significan "sin cambios".
        Un enemigo que sale de la visión aparece en `enemiesRemoved`.
      additionalProperties: false
      required: [status, me, events]
      properties:
        status:
          $ref: '#/components/schemas/MatchStatus'
        floorChanged:
          description: Nueva sala si el grupo bajó de piso (el cliente descarta sus casillas); si no, `null`.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: 'null'
        me:
          $ref: '#/components/schemas/SelfHero'
        alliesChanged:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/OtherHero'
        enemiesUpserted:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Enemy'
        enemiesRemoved:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 100000
        tilesChanged:
          type: array
          maxItems: 81
          items:
            $ref: '#/components/schemas/Tile'
        events:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/VisibleEvent'
    RevealedPact:
      type: object
      additionalProperties: false
      required: [pactId, description, fulfilled]
      properties:
        pactId:
          type: string
          enum: [FINAL_BLOW_WARDEN, NEVER_DOWNED, OPEN_3_CHESTS, REVIVE_2_ALLIES, BETRAY_TWICE_UNSEEN]
        description:
          type: string
          maxLength: 140
        fulfilled:
          type: boolean

    # ───────────── Mensajes servidor → cliente ─────────────
    RoundOpened:
      type: object
      additionalProperties: false
      required: [matchId, round, deadline, durationMs, expectedPlayers]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        deadline:
          $ref: '#/components/schemas/Timestamp'
        durationMs:
          type: integer
          minimum: 1000
          maximum: 60000
          description: Duración de la planificación (20 000 por defecto); útil si el reloj del cliente difiere.
        expectedPlayers:
          type: integer
          minimum: 1
          maximum: 4
          description: Jugadores vivos de los que se espera orden.
    PlayerDecided:
      type: object
      additionalProperties: false
      required: [matchId, round, playerId, decidedCount, expectedPlayers]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        playerId:
          $ref: '#/components/schemas/Uuid'
        decidedCount:
          type: integer
          minimum: 1
          maximum: 4
        expectedPlayers:
          type: integer
          minimum: 1
          maximum: 4
    RoundResolved:
      type: object
      additionalProperties: false
      required: [matchId, round, previousSeq, seq, delta]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        round:
          $ref: '#/components/schemas/RoundNumber'
        previousSeq:
          $ref: '#/components/schemas/Seq'
        seq:
          $ref: '#/components/schemas/Seq'
        delta:
          $ref: '#/components/schemas/PlayerViewDelta'
    Snapshot:
      type: object
      additionalProperties: false
      required: [matchId, seq, serverTime, view]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        seq:
          $ref: '#/components/schemas/Seq'
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        view:
          $ref: '#/components/schemas/PlayerView'
    DraftOffer:
      type: object
      additionalProperties: false
      required: [matchId, offerId, source, options, deadline]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        offerId:
          $ref: '#/components/schemas/Uuid'
        source:
          type: string
          enum: [INITIAL_DRAFT, ALTAR]
        options:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BlessingId'
        deadline:
          $ref: '#/components/schemas/Timestamp'
    PlayerConnectionChanged:
      type: object
      additionalProperties: false
      required: [matchId, playerId, state, graceDeadline]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        playerId:
          $ref: '#/components/schemas/Uuid'
        state:
          type: string
          enum: [CONNECTED, DISCONNECTED, ABANDONED]
        graceDeadline:
          description: Fin de la gracia de reconexión si está `DISCONNECTED`; si no, `null`.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
    MatchFinished:
      type: object
      additionalProperties: false
      required: [matchId, seq, outcome, rounds, winners, standings, finishedAt, replayUrl]
      properties:
        matchId:
          $ref: '#/components/schemas/Uuid'
        seq:
          $ref: '#/components/schemas/Seq'
        outcome:
          type: string
          enum: [WARDEN_DEFEATED, DRAW, EMBER_EXTINGUISHED, ABANDONED, FAULTED]
          description: |
            `WARDEN_DEFEATED` = cayó el Celador con un ganador; `DRAW` = cayó con empate en ascuas;
            `EMBER_EXTINGUISHED` = derrota colectiva (todos caídos o 60 rondas);
            `ABANDONED` = quedaron menos de 1 humano activo; `FAULTED` = error aislado del servidor.
        rounds:
          type: integer
          minimum: 0
          maximum: 60
        winners:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        standings:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [playerId, displayName, hero, finalState, embers, placement, pact]
            properties:
              playerId:
                $ref: '#/components/schemas/Uuid'
              displayName:
                $ref: '#/components/schemas/DisplayName'
              hero:
                $ref: '#/components/schemas/HeroKind'
              finalState:
                $ref: '#/components/schemas/HeroState'
              embers:
                $ref: '#/components/schemas/Embers'
              placement:
                type: integer
                minimum: 1
                maximum: 4
              pact:
                anyOf:
                  - $ref: '#/components/schemas/RevealedPact'
                  - type: 'null'
        finishedAt:
          $ref: '#/components/schemas/Timestamp'
        replayUrl:
          type: string
          format: uri
          maxLength: 256
    ServerDraining:
      type: object
      additionalProperties: false
      required: [reason, reconnectAfterMs, closesAt]
      properties:
        reason:
          type: string
          enum: [DEPLOYMENT, SCALE_IN, SHUTDOWN]
        reconnectAfterMs:
          type: integer
          minimum: 0
          maximum: 10000
          description: Espera sugerida (con *jitter*) antes de reconectar, para no saturar a las otras réplicas.
        closesAt:
          $ref: '#/components/schemas/Timestamp'
