asyncapi: 3.0.0
id: urn:ascua:realtime:match
info:
  title: Ascua — protocolo en tiempo real
  version: 2.0.0
  description: |
    Contrato del hub SignalR **`/realtime/match`** del servidor autoritativo de *Ascua*
    (mazmorra semi-cooperativa por turnos simultáneos, 2-4 jugadores).

    Este documento describe **el servidor**: las operaciones `receive` son invocaciones que
    el cliente hace al hub y las operaciones `send` son mensajes que el hub empuja al cliente.

    ## 1. Conexión

    | Aspecto | Valor |
    |---|---|
    | Transporte | Solo **WebSocket seguro (`wss`)**. Sin *negotiate*: el cliente usa `skipNegotiation: true` y `transport: WebSockets`. No hay SSE ni *long polling*, así que no hacen falta *sticky sessions* |
    | URL | `wss://{apiHost}/realtime/match?protocolVersion=2&access_token={ticket}` |
    | Protocolo de hub | **MessagePack** (`"protocol":"messagepack","version":1` en el *handshake* de SignalR). Los objetos se serializan como **mapas con claves de texto** (camelCase), nunca como arreglos posicionales, para que agregar campos sea compatible. **JSON** (`"protocol":"json"`) se admite **solo para depuración** en ambientes `local` y `dev`; en `prod` se rechaza |
    | Tamaño máximo | 4 KB por mensaje entrante (`MaximumReceiveMessageSize`) |
    | Heartbeat | El servidor envía *ping* de SignalR cada **10 s** (`KeepAliveInterval`). Si el servidor no recibe nada del cliente en **30 s** (`ClientTimeoutInterval`) cierra la conexión. El cliente debe configurar `serverTimeoutInMilliseconds = 30000` y `keepAliveIntervalInMilliseconds = 10000` |
    | Conexiones por usuario | Máximo 3 simultáneas (contador en Redis) |
    | Gracia de reconexión | Al caer la conexión se marca `disconnectedAt`; durante **60 s** el servidor aplica `GUARD` en cada ronda. Si el jugador no vuelve, se aplica la regla de abandono |

    ### Autenticación (ticket de un solo uso)

    1. El cliente, autenticado por HTTP con su JWT de acceso, llama a
       `POST /api/v1/realtime/tickets` (cuerpo `{ "matchId": "<uuid>" }`).
    2. El servidor responde `201 { "ticket": "<opaco, 43 caracteres base64url>", "expiresAt": "..." }`.
       El ticket vale **30 s**, está atado al usuario y a la partida, y se guarda en Redis.
    3. El cliente abre el WebSocket enviando el ticket en el *query* `access_token`
       (es lo que hace `accessTokenFactory` del cliente de SignalR con WebSockets).
    4. En el *upgrade* el servidor lo consume con `GETDEL`: un ticket **no se puede reutilizar**.
       Si falta, venció o ya se usó, el *upgrade* se rechaza con **HTTP 401** y no se abre el socket.

    El JWT nunca viaja en la URL del WebSocket: solo el ticket, que caduca enseguida y no sirve dos veces
    (ver ADR-0006). Para reconectar, el cliente pide **un ticket nuevo**.

    ### Flujo típico

    ```
    POST /api/v1/realtime/tickets ─► ticket
    WS upgrade (ticket, protocolVersion=2) ─► handshake MessagePack
    JoinMatch ─► ACK con Snapshot
    [Drafting]   DraftOffer ─► DraftPick ─► ACK
    [InProgress] RoundOpened ─► SubmitOrder ─► ACK ─► PlayerDecided (a todos) ─► RoundResolved (a cada uno su vista)
    [Extinto]    RoundResolved (EXTINGUISHED) ─► PathOffer (privado) ─► ChoosePath ─► ACK ─► RoundResolved (PATH_CHOSEN a todos)
    [Campanero]  PlayerDecided de todos los demás ─► LastWord (privado) ─► SubmitOrder
    [Cualquiera] SendSignal ─► ACK ─► SignalReceived (a su bando)
    ... ─► MatchFinished ─► cierre MATCH_FINISHED
    ```

    ## 2. Códigos y razones de cierre

    La razón **normativa** viaja en el mensaje `Close` de SignalR (campo `error`, con el formato
    `CODIGO: descripción`) junto con `allowReconnect`. El código WebSocket es informativo
    (algunos proxies lo reescriben). Los rechazos del *upgrade* no abren el socket y se informan con HTTP.

    | WS / HTTP | Razón (`Close.error`) | `allowReconnect` | Cuándo | Qué hace el cliente |
    |---|---|---|---|---|
    | HTTP 401 | `TICKET_INVALID` | — | Ticket ausente, vencido, ya usado o de otra partida | Pide un ticket nuevo y reintenta **una** vez; si vuelve a fallar, renueva el JWT |
    | HTTP 400 | `UNSUPPORTED_PROTOCOL_VERSION` | — | `protocolVersion` ausente o no soportado | Actualiza el cliente. No reintenta |
    | HTTP 429 | `CONNECTION_LIMIT` | — | El usuario ya tiene 3 conexiones abiertas | Cierra otras pestañas; reintenta con *backoff* |
    | 1000 | `MATCH_FINISHED` | `false` | Se envió `MatchFinished` y la partida terminó (o expiró/fue abandonada) | Muestra el resultado. No reconecta |
    | 1001 | `SERVER_DRAINING` | `true` | La réplica se apaga (despliegue o reducción de escala); antes se envió `ServerDraining` | Reconecta tras `reconnectAfterMs` con un ticket nuevo; otra réplica lo atiende |
    | 1009 | `MESSAGE_TOO_LARGE` | `true` | Un mensaje entrante superó 4 KB | Reconecta; corrige el cliente. La partida **sigue** (cuenta la gracia) |
    | 1011 | `INTERNAL_ERROR` | `true` | Fallo inesperado de la réplica | Reconecta con *backoff* exponencial (1, 2, 4… máx. 30 s) |
    | 4001 | `SESSION_REPLACED` | `false` | El mismo usuario abrió otra conexión a la misma partida; la vieja se cierra | No reconecta: la sesión nueva ya está activa |
    | 4003 | `KICKED_BY_ADMIN` | `false` | Un administrador terminó la partida o suspendió la cuenta (queda auditado) | Muestra el aviso. No reconecta (una cuenta suspendida tampoco puede pedir tickets) |
    | 4029 | `RATE_LIMITED` | `true` | Abuso sostenido: más de 50 rechazos `RATE_LIMITED` en 60 s | Espera al menos 60 s antes de reconectar |
    | — | `HEARTBEAT_TIMEOUT` | — | Lo detecta el **cliente**: 30 s sin mensajes del servidor | Reconecta con un ticket nuevo |

    > **Cómo lo implementa el servidor (1.1.0).** SignalR no deja que el servidor fije el texto de
    > `Close.error`, así que:
    > - Los rechazos del *upgrade* son Problem Details (RFC 9457) con `code` `ticket-invalid` (401),
    >   `unsupported-protocol-version` (400) y `connection-limit` (429). La versión se revisa **antes**
    >   de consumir el ticket: un 400 no lo gasta.
    > - `SESSION_REPLACED` llega como mensaje `Error` con ese código justo antes de cerrar la conexión vieja.
    > - `KICKED_BY_ADMIN` llega como mensaje `Error` con ese código. Si se suspendió la cuenta, la conexión
    >   se cierra enseguida; si se terminó la partida, antes llega `MatchFinished` (`outcome: TERMINATED`) y la
    >   conexión se cierra unos 2 s después (desde 1.2.0).
    > - `SERVER_DRAINING` llega como mensaje `ServerDraining`; la conexión se corta al apagarse la réplica.
    > - Tras `MatchFinished` el servidor **no** cierra la conexión: el cliente muestra el resultado y la cierra.
    > - `RATE_LIMITED` sostenido y `MESSAGE_TOO_LARGE` cierran sin razón legible; el cliente reconecta con *backoff*.

    ## 3. Errores

    Toda invocación responde con su ACK o con `InvocationError { error: { code, message, … } }`
    (nunca con una excepción de SignalR sin tipo). Los errores que no responden a una invocación
    concreta llegan como el mensaje `Error`.

    > **Un mensaje inválido se rechaza sin cerrar la partida.** El servidor responde el error,
    > no aplica nada y la partida sigue para todos. Solo `MESSAGE_TOO_LARGE` y el abuso sostenido
    > de `RATE_LIMITED` cierran **la conexión** (no la partida).

    | Código | Reintentable | Significado |
    |---|---|---|
    | `INVALID_PAYLOAD` | No | El mensaje no cumple el esquema (tipos, rangos, `maxLength`, campos extra) |
    | `INVALID_ORDER` | No | La orden es válida en forma pero ilegal en el estado actual (p. ej. habilidad en enfriamiento) |
    | `STALE_ROUND` | No | `round` no es la ronda abierta (ya se cerró o aún no existe). `details.currentRound` indica la vigente |
    | `ORDER_ALREADY_SUBMITTED` | No | Ya hay una orden para esta ronda con **otro** `clientActionId`; la primera es la que vale |
    | `ORDER_TOO_LATE` | No | Con el Repique sonando, venció tu plazo reducido: guardas (o enciendes el Faro) en esta ronda (desde 2.0.0) |
    | `DUPLICATE_ACTION` | — | **No es un fallo.** Reenvío del mismo `clientActionId`: se devuelve el ACK original con `result: DUPLICATE_ACTION` y no se aplica nada |
    | `NOT_PARTICIPANT` | No | El usuario no pertenece a la partida |
    | `NOT_JOINED` | No | Se invocó un método de partida sin `JoinMatch` previo en esta conexión |
    | `PLAYER_DOWN` | No | El héroe está caído, extinto o retirado y no puede actuar |
    | `MATCH_NOT_FOUND` | No | La partida no existe |
    | `MATCH_NOT_ACTIVE` | No | La partida no está en el estado que exige la operación (terminada, expirada, `Faulted`…) |
    | `ALREADY_IN_ANOTHER_MATCH` | No | El usuario tiene otra partida activa |
    | `DRAFT_CLOSED` | No | La oferta de draft ya se resolvió o venció |
    | `INVALID_PICK` | No | La bendición elegida no está entre las opciones de esa oferta |
    | `PATH_CLOSED` | No | La oferta de camino no está abierta: no estás extinto, ya elegiste otro camino en esa oferta, el `offerId` es de otra oferta o ya se resolvió/venció (desde 1.3.0) |
    | `RATE_LIMITED` | Sí | Se agotó el *token bucket* de la conexión (capacidad 20, recarga 5/s), o `SendSignal` antes de 3 s desde tu última señal. `retryAfterMs` indica la espera |
    | `MESSAGE_TOO_LARGE` | No | Mensaje mayor a 4 KB (además cierra la conexión con 1009) |
    | `INTERNAL_ERROR` | Sí | Error del servidor; no se aplicó nada. Se puede reintentar con el **mismo** `clientActionId` |
    | `SESSION_REPLACED` | No | Solo en el mensaje `Error`: esta conexión se cierra porque el usuario abrió otra en la misma partida (desde 1.1.0) |
    | `KICKED_BY_ADMIN` | No | Solo en el mensaje `Error`: un administrador terminó la partida (`details.status: TERMINATED`) o suspendió la cuenta; la conexión se cierra (desde 1.2.0) |

    Los clientes deben tratar un código desconocido como error genérico no reintentable.

    ## 4. Orden, entrega y recuperación

    - Cada partida tiene una secuencia `seq` monótona (la de sus eventos en Postgres).
      `RoundResolved` trae `previousSeq` y `seq`: el cliente aplica el delta solo si
      `previousSeq` coincide con su último `seq`; si no, pide `GetSnapshot`.
    - La entrega por WebSocket es *at-most-once*; la recuperación es siempre por `Snapshot`.
    - `SubmitOrder` es idempotente por `clientActionId` (UUID v7 generado en el cliente):
      ante un *timeout* el cliente reintenta con el **mismo** id.
    - Ningún mensaje revela información oculta de otro jugador: órdenes antes de resolver,
      pactos, opciones de draft, bendiciones ajenas, contenido de cofres, casillas fuera de visión,
      el huésped de Polizón, deudas ajenas ni traiciones anónimas antes del final. Cada jugador recibe
      su propia vista. La única excepción a «órdenes antes de resolver» es `LastWord`: la pasiva del
      Campanero, privada para él.

    ## 5. Versionado y compatibilidad

    - **`protocolVersion`** (entero, *query* del *upgrade*) es la versión **mayor** del protocolo.
      Esta especificación define `protocolVersion=2`. `info.version` sigue SemVer y su mayor coincide.
    - Dentro de una versión mayor solo hay **cambios aditivos** (sube la menor):
      campos opcionales nuevos, mensajes servidor→cliente nuevos, códigos de error nuevos y
      valores nuevos en enumeraciones marcadas como extensibles (`VisibleEvent.type`).
      Los clientes **deben ignorar** campos y mensajes desconocidos.
    - Un cambio incompatible (quitar o renombrar un campo, cambiar un tipo, endurecer una
      validación) exige una versión mayor nueva. El servidor acepta la mayor actual y la anterior
      durante al menos 30 días; luego rechaza la vieja con `UNSUPPORTED_PROTOCOL_VERSION`. La 2.0.0 es
      una excepción deliberada: no hay producción ni clientes externos, y una partida con héroes viejos
      ya no se puede jugar, así que la versión 1 se rechaza desde el primer día (ADR-0009).
    - Cada mensaje declara `x-since` (versión en que apareció). Los cambios se registran en
      `docs/adr/` y en el changelog de la versión.

    ## 6. Caminos tras la extinción (desde 1.3.0)

    Reglas en `planteamiento/04-caminos-tras-morir.md`. Al **extinguirse** (3 rondas caído, una grieta o
    un Renegado derrotado) el jugador elige camino; cada extinción abre una oferta nueva.

    | Paso | Mensaje | Quién lo ve |
    |---|---|---|
    | Se extingue | `RoundResolved` con `EXTINGUISHED` (y `me.state: EXTINCT`) | Todos |
    | Oferta (15 s desde que abre la ronda) | `PathOffer` (también se reenvía tras `JoinMatch`/`GetSnapshot`) | Solo él |
    | Elige | `ChoosePath { matchId, offerId, path: FRIENDSHIP \| VENGEANCE }` → `ChoosePathAck` | Solo él (`me.path.choice`) |
    | Vence el plazo | El servidor elige `FRIENDSHIP` (`me.path.choice` llega en un `Snapshot`) | Solo él |
    | Se resuelve la ronda | `PATH_CHOSEN` con `detail` = camino, y el nuevo `state` | Todos |

    - La ronda **espera** la elección de un jugador conectado (como espera las órdenes), hasta el plazo de 15 s.
    - **Brasa errante** (`state: EMBER_SPIRIT`): da órdenes con los mismos tipos (`MOVE` = Deriva, `ABILITY` =
      Avivar, `INTERACT` = Reavivar, `ATTACK` = Estorbo, `GUARD` = Faro). Es visible para el grupo y su
      posición llega en `allies` aunque esté lejos. Renace al bajar de piso (`EMBER_REBORN`).
    - **Renegado** (`state: RENEGADE`): mientras espera no tiene posición (`me.path.awaitingSpawn`); al aparecer
      (`RENEGADE_SPAWNED`) da órdenes como cualquiera. El grupo lo ve en `allies` (es un portador) pero **solo
      con posición dentro de la visión**, igual que él ve a los héroes. Gana con `THRESHOLD_CLAIMED`.
    - Privado de cada jugador: `PathOffer`, `me.path` (oferta, elección sin revelar, ecos, ascuas guardadas) y
      los eventos `PATH_OFFERED`, `PATH_SELECTED` y `ECHO_GAINED`.

    ## 7. Los nueve héroes (desde 2.0.0)

    Reglas en `planteamiento/05-heroes.md`. Todo usa las órdenes de siempre: no hay selección de objetivos.

    | `hero` | `ABILITY` | Lo que cambia en el cable |
    |---|---|---|
    | `ERRATA` | Corregir (dirección): desvía todo anuncio con alguna casilla a ≤2 | Ve los anuncios de toda la sala: los de enemigos que no ve llegan en `hiddenTelegraphs`, sin autor. El uso es anónimo: los demás solo ven `ATTACK_CORRECTED` |
    | `ANTEAYER` | Volver (dirección indiferente) | `me.rewindTile` y `me.rewindHp`: adónde saltaría (`null` sin 2 rondas de historia). Sus ecos llegan en `echoes` y al disparar en `ECHO_FIRED` |
    | `HILVAN` | Tensar (dirección indiferente) | `me.secondBody` y `allies[].secondBody`. `MOVED`/`BOUNCED` con `detail: SECOND_BODY`. `MOVE`, `ATTACK` e `INTERACT` este/oeste van en espejo |
    | `POLIZON` | Abordar (dirección); dentro, salir | `me.hostEnemyId` (solo él). Para los demás, `position: null`, ni rastro de su huésped. `HOST_BOARDED` y `HOST_DRAINED` son privados; `HOST_EXITED` lo ve quien vea la casilla |
    | `ESCUCHA` | Grito (dirección indiferente) | `tiles` trae toda la sala, pero `enemies`, `allies[].position`, cofres y fuego solo si están a su alcance (`VisionRadius` 1) o hicieron ruido. `noiseTiles` son las casillas donde oyó algo. Tras `SHOUTED`, su bando ve la sala entera hasta la próxima resolución |
    | `USURERA` | Préstamo (dirección) | `me.debt`/`me.debtTo` para el deudor; `allies[].debtToYou` para ella. `DEBT_CHANGED` les llega solo a ellos dos |
    | `AVARO` | Soborno (dirección) | Su vida son sus `embers`: `hp` es 1 mientras está en pie y `maxHp` es 1. `groundEmbers` son las ascuas en el suelo. `EMBERS_DROPPED`, `EMBERS_PICKED_UP`, `ENEMY_BRIBED` |
    | `MAMPOSTERO` | Corrimiento (dirección) | `ROOM_SHIFTED` llega a todos: `amount` = índice de la línea, `detail` = `ROW_E`, `ROW_W`, `COLUMN_N` o `COLUMN_S`. Las posiciones y casillas ya llegan movidas |
    | `CAMPANERO` | Repique (dirección indiferente) | Ver abajo |

    **Último en hablar.** Si todos los demás ya decidieron y él no, el Campanero recibe `LastWord` con las
    órdenes de todos (solo los tipos, si es Renegado). Quien está en su gracia de reconexión no cuenta y figura
    como `GUARD`. Se reenvía tras `JoinMatch` y `GetSnapshot` mientras siga aplicando. Su orden se resuelve
    igual con las demás.

    **Repique.** En la ronda siguiente, `RoundOpened` trae `bellDeadline` y `bellRingerId`, `view.bell` describe
    el Repique y `roundDeadline` es el plazo **de cada jugador**: el reducido (8 s por defecto) para los demás y
    el normal para quien lo tocó. Si el Campanero decide primero, los demás **conservan** sus segundos: la ronda
    se cierra cuando todos decidieron o venció su plazo, con el máximo de la ronda normal. Al vencer el plazo
    reducido llega un `Snapshot` a todos con `view.bell.closed: true` (y `BELL_EXPIRED`) y una orden tardía recibe
    `ORDER_TOO_LATE`. El plazo es durable: sobrevive a un reinicio.

    **Señales rápidas.** `SendSignal { matchId, kind, position? }`, hasta 1 cada 3 s por jugador. Llega solo a su
    bando (y a quien la envía) como `SignalReceived`. La casilla la eligió quien la envía, así que **puede ser
    mentira**. No se guarda ni aparece en la reproducción.

    **Traiciones.** El daño a un aliado desviado por Errata o dado desde un huésped se registra culpando al
    monstruo; `BETRAYAL_RECORDED` solo lo recibe quien la cometió. Al final, `MatchFinished.betrayals` y los eventos
    `BETRAYAL_REVEALED` las revelan, sumadas por traidor y víctima («Errata le costó 3 de vida a Ana»).

    ### Changelog

    - **2.0.0** (incompatible): `protocolVersion` pasa a 2 (la 1 se rechaza). `HeroKind` pasa a `ERRATA`,
      `ANTEAYER`, `HILVAN`, `POLIZON`, `ESCUCHA`, `USURERA`, `AVARO`, `MAMPOSTERO` y `CAMPANERO` (fuera `YUNQUE`,
      `CHISPA`, `CUERVO` y `RAIZ`). `SelfHero` pierde `charges` y `stealthRoundsLeft`, suma `secondBody`,
      `hostEnemyId`, `debt`, `debtTo`, `rewindTile` y `rewindHp`; `abilityCooldown` llega hasta 12. `OtherHero` suma
      `secondBody` y `debtToYou`. `PlayerView` y `PlayerViewDelta` suman `hiddenTelegraphs`, `echoes`,
      `groundEmbers`, `noiseTiles` y `bell`; el delta suma `roundDeadline`. `RoundOpened` suma `bellDeadline` y
      `bellRingerId`. `MatchFinished` suma `betrayals`. Mensajes nuevos: `SendSignal` (+ ACK), `SignalReceived` y
      `LastWord`. `ErrorCode` suma `ORDER_TOO_LATE`. `VisibleEvent` suma el campo `tiles` y los tipos
      `ECHO_FIRED`, `ATTACK_CORRECTED`, `BETRAYAL_RECORDED`, `BETRAYAL_REVEALED`, `HOST_BOARDED`, `HOST_EXITED`,
      `HOST_DRAINED`, `WARDEN_TURNED`, `SHOUTED`, `DEBT_CHANGED`, `EMBERS_DROPPED`, `EMBERS_PICKED_UP`, `EMBERS_LOST`,
      `ENEMY_BRIBED`, `ROOM_SHIFTED`, `BELL_RUNG` y `BELL_EXPIRED`. `BLOCKED` ya no se usa para el bloqueo frontal ni
      para la Muralla, que dejan de existir.

    - **1.3.0** (aditivo): caminos tras la extinción. Mensajes nuevos `ChoosePath` (+ ACK) y `PathOffer`;
      `ErrorCode` suma `PATH_CLOSED`; `HeroState` suma `EMBER_SPIRIT` y `RENEGADE`; `MatchFinished.outcome`
      suma `THRESHOLD_CLAIMED`; `SelfHero` suma `path` (opcional, `null` si nunca se extinguió) y
      `abilityCooldown` llega hasta 8 (el Renegado tiene enfriamiento ×2); `VisibleEvent` suma el campo
      opcional `detail` y los tipos `PATH_OFFERED`, `PATH_SELECTED`, `PATH_CHOSEN`, `EMBER_REBORN`,
      `RENEGADE_SPAWNED`, `RENEGADE_DEFEATED`, `ECHO_GAINED`, `SHIELD_KINDLED`, `ATTACK_HINDERED`,
      `BEACON_LIT` y `WARMTH_HEALED`; `BLOCKED` puede traer `detail: WARNING_SHIELD`. `EXTINGUISHED` ya no
      quita ascuas (`amount` es 0): pasan a ser ascuas guardadas.

    - **1.2.0** (aditivo): `ErrorCode` suma `KICKED_BY_ADMIN` (solo en `Error`); `MatchStatus` y
      `MatchFinished.outcome` suman `TERMINATED` (partida detenida por un administrador, auditada).

    - **1.1.0** (aditivo): `VisibleEvent.type` suma `ABILITY_USED` (habilidad usada) y `GUARDED`
      (GUARDAR elegido); `ErrorCode` suma `SESSION_REPLACED` (solo en `Error`). Se documenta cómo el
      servidor comunica las razones de cierre (sección 2).
    - **1.0.0**: versión inicial.
  contact:
    name: Equipo Ascua
    url: https://github.com/JanPMolina/ascua
  tags:
    - name: invocacion
      description: Cliente → servidor (invocación de un método del hub con ACK).
    - name: difusion
      description: Servidor → todos los jugadores de la partida.
    - name: privado
      description: Servidor → un solo jugador; contiene información que solo él puede ver.
    - name: sistema
      description: Mensajes de operación del servidor (errores, drenado).
  externalDocs:
    description: Arquitectura y decisiones (ADRs)
    url: https://github.com/JanPMolina/ascua/tree/main/docs/adr

defaultContentType: application/x-msgpack

servers:
  production:
    host: '{apiHost}'
    protocol: wss
    pathname: /realtime/match
    title: Azure Container Apps
    summary: Ingress HTTPS/WSS de Container Apps (dev y prod).
    variables:
      apiHost:
        default: ascua-api.azurecontainerapps.io
        description: FQDN del ingress del ambiente (dev o prod).
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'
  local:
    host: localhost:8080
    protocol: ws
    pathname: /realtime/match
    title: Desarrollo local
    summary: Solo para desarrollo; admite JSON para depuración.
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'

channels:
  match:
    address: /realtime/match
    title: Hub de partida
    description: |
      Conexión SignalR de un jugador. Tras `JoinMatch` la conexión entra al grupo `match:{matchId}`
      (difusiones) y recibe además los mensajes privados dirigidos a su usuario.
    servers:
      - $ref: '#/servers/production'
      - $ref: '#/servers/local'
    bindings:
      ws:
        method: GET
        query:
          type: object
          additionalProperties: false
          required: [protocolVersion, access_token]
          properties:
            protocolVersion:
              type: string
              enum: ['2']
              description: Versión mayor del protocolo de Ascua.
            access_token:
              type: string
              minLength: 43
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
              description: Ticket de un solo uso emitido por `POST /api/v1/realtime/tickets`.
        bindingVersion: 0.1.0
    messages:
      JoinMatch:
        $ref: '#/components/messages/JoinMatch'
      JoinMatchAck:
        $ref: '#/components/messages/JoinMatchAck'
      SubmitOrder:
