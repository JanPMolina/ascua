asyncapi: 3.0.0
id: urn:ascua:realtime:match
info:
  title: Ascua — protocolo en tiempo real
  version: 1.0.0
  description: |
    Contrato del hub SignalR **`/realtime/match`** del servidor autoritativo de *Ascua*
    (mazmorra semi-cooperativa por turnos simultáneos, 2-4 jugadores).

    Este documento describe **el servidor**: las operaciones `receive` son invocaciones que
    el cliente hace al hub y las operaciones `send` son mensajes que el hub empuja al cliente.

    ## 1. Conexión

    | Aspecto | Valor |
    |---|---|
    | Transporte | Solo **WebSocket seguro (`wss`)**. Sin *negotiate*: el cliente usa `skipNegotiation: true` y `transport: WebSockets`. No hay SSE ni *long polling*, así que no hacen falta *sticky sessions* |
    | URL | `wss://{apiHost}/realtime/match?protocolVersion=1&access_token={ticket}` |
    | Protocolo de hub | **MessagePack** (`"protocol":"messagepack","version":1` en el *handshake* de SignalR). Los objetos se serializan como **mapas con claves de texto** (camelCase), nunca como arreglos posicionales, para que agregar campos sea compatible. **JSON** (`"protocol":"json"`) se admite **solo para depuración** en ambientes `local` y `dev`; en `prod` se rechaza |
    | Tamaño máximo | 4 KB por mensaje entrante (`MaximumReceiveMessageSize`) |
    | Heartbeat | El servidor envía *ping* de SignalR cada **10 s** (`KeepAliveInterval`). Si el servidor no recibe nada del cliente en **30 s** (`ClientTimeoutInterval`) cierra la conexión. El cliente debe configurar `serverTimeoutInMilliseconds = 30000` y `keepAliveIntervalInMilliseconds = 10000` |
    | Conexiones por usuario | Máximo 3 simultáneas (contador en Redis) |
    | Gracia de reconexión | Al caer la conexión se marca `disconnectedAt`; durante **60 s** el servidor aplica `GUARD` en cada ronda. Si el jugador no vuelve, se aplica la regla de abandono |

    ### Autenticación (ticket de un solo uso)

    1. El cliente, autenticado por HTTP con su JWT de acceso, llama a
       `POST /api/v1/realtime/tickets` (cuerpo `{ "matchId": "<uuid>" }`).
    2. El servidor responde `201 { "ticket": "<opaco, 43 caracteres base64url>", "expiresAt": "..." }`.
       El ticket vale **30 s**, está atado al usuario y a la partida, y se guarda en Redis.
    3. El cliente abre el WebSocket enviando el ticket en el *query* `access_token`
       (es lo que hace `accessTokenFactory` del cliente de SignalR con WebSockets).
    4. En el *upgrade* el servidor lo consume con `GETDEL`: un ticket **no se puede reutilizar**.
       Si falta, venció o ya se usó, el *upgrade* se rechaza con **HTTP 401** y no se abre el socket.

    El JWT nunca viaja en la URL del WebSocket: solo el ticket, que caduca enseguida y no sirve dos veces
    (ver ADR-0006). Para reconectar, el cliente pide **un ticket nuevo**.

    ### Flujo típico

    ```
    POST /api/v1/realtime/tickets ─► ticket
    WS upgrade (ticket, protocolVersion=1) ─► handshake MessagePack
    JoinMatch ─► ACK con Snapshot
    [Drafting]   DraftOffer ─► DraftPick ─► ACK
    [InProgress] RoundOpened ─► SubmitOrder ─► ACK ─► PlayerDecided (a todos) ─► RoundResolved (a cada uno su vista)
    ... ─► MatchFinished ─► cierre MATCH_FINISHED
    ```

    ## 2. Códigos y razones de cierre

    La razón **normativa** viaja en el mensaje `Close` de SignalR (campo `error`, con el formato
    `CODIGO: descripción`) junto con `allowReconnect`. El código WebSocket es informativo
    (algunos proxies lo reescriben). Los rechazos del *upgrade* no abren el socket y se informan con HTTP.

    | WS / HTTP | Razón (`Close.error`) | `allowReconnect` | Cuándo | Qué hace el cliente |
    |---|---|---|---|---|
    | HTTP 401 | `TICKET_INVALID` | — | Ticket ausente, vencido, ya usado o de otra partida | Pide un ticket nuevo y reintenta **una** vez; si vuelve a fallar, renueva el JWT |
    | HTTP 400 | `UNSUPPORTED_PROTOCOL_VERSION` | — | `protocolVersion` ausente o no soportado | Actualiza el cliente. No reintenta |
    | HTTP 429 | `CONNECTION_LIMIT` | — | El usuario ya tiene 3 conexiones abiertas | Cierra otras pestañas; reintenta con *backoff* |
    | 1000 | `MATCH_FINISHED` | `false` | Se envió `MatchFinished` y la partida terminó (o expiró/fue abandonada) | Muestra el resultado. No reconecta |
    | 1001 | `SERVER_DRAINING` | `true` | La réplica se apaga (despliegue o reducción de escala); antes se envió `ServerDraining` | Reconecta tras `reconnectAfterMs` con un ticket nuevo; otra réplica lo atiende |
    | 1009 | `MESSAGE_TOO_LARGE` | `true` | Un mensaje entrante superó 4 KB | Reconecta; corrige el cliente. La partida **sigue** (cuenta la gracia) |
    | 1011 | `INTERNAL_ERROR` | `true` | Fallo inesperado de la réplica | Reconecta con *backoff* exponencial (1, 2, 4… máx. 30 s) |
    | 4001 | `SESSION_REPLACED` | `false` | El mismo usuario abrió otra conexión a la misma partida; la vieja se cierra | No reconecta: la sesión nueva ya está activa |
    | 4003 | `KICKED_BY_ADMIN` | `false` | Un administrador expulsó al jugador (queda auditado) | Muestra el aviso. No reconecta |
    | 4029 | `RATE_LIMITED` | `true` | Abuso sostenido: más de 50 rechazos `RATE_LIMITED` en 60 s | Espera al menos 60 s antes de reconectar |
    | — | `HEARTBEAT_TIMEOUT` | — | Lo detecta el **cliente**: 30 s sin mensajes del servidor | Reconecta con un ticket nuevo |

    ## 3. Errores

    Toda invocación responde con su ACK o con `InvocationError { error: { code, message, … } }`
    (nunca con una excepción de SignalR sin tipo). Los errores que no responden a una invocación
    concreta llegan como el mensaje `Error`.

    > **Un mensaje inválido se rechaza sin cerrar la partida.** El servidor responde el error,
    > no aplica nada y la partida sigue para todos. Solo `MESSAGE_TOO_LARGE` y el abuso sostenido
    > de `RATE_LIMITED` cierran **la conexión** (no la partida).

    | Código | Reintentable | Significado |
    |---|---|---|
    | `INVALID_PAYLOAD` | No | El mensaje no cumple el esquema (tipos, rangos, `maxLength`, campos extra) |
    | `INVALID_ORDER` | No | La orden es válida en forma pero ilegal en el estado actual (p. ej. habilidad en enfriamiento) |
    | `STALE_ROUND` | No | `round` no es la ronda abierta (ya se cerró o aún no existe). `details.currentRound` indica la vigente |
    | `ORDER_ALREADY_SUBMITTED` | No | Ya hay una orden para esta ronda con **otro** `clientActionId`; la primera es la que vale |
    | `DUPLICATE_ACTION` | — | **No es un fallo.** Reenvío del mismo `clientActionId`: se devuelve el ACK original con `result: DUPLICATE_ACTION` y no se aplica nada |
    | `NOT_PARTICIPANT` | No | El usuario no pertenece a la partida |
    | `NOT_JOINED` | No | Se invocó un método de partida sin `JoinMatch` previo en esta conexión |
    | `PLAYER_DOWN` | No | El héroe está caído, extinto o retirado y no puede actuar |
    | `MATCH_NOT_FOUND` | No | La partida no existe |
    | `MATCH_NOT_ACTIVE` | No | La partida no está en el estado que exige la operación (terminada, expirada, `Faulted`…) |
    | `ALREADY_IN_ANOTHER_MATCH` | No | El usuario tiene otra partida activa |
    | `DRAFT_CLOSED` | No | La oferta de draft ya se resolvió o venció |
    | `INVALID_PICK` | No | La bendición elegida no está entre las opciones de esa oferta |
    | `RATE_LIMITED` | Sí | Se agotó el *token bucket* de la conexión (capacidad 20, recarga 5/s). `retryAfterMs` indica la espera |
    | `MESSAGE_TOO_LARGE` | No | Mensaje mayor a 4 KB (además cierra la conexión con 1009) |
    | `INTERNAL_ERROR` | Sí | Error del servidor; no se aplicó nada. Se puede reintentar con el **mismo** `clientActionId` |

    Los clientes deben tratar un código desconocido como error genérico no reintentable.

    ## 4. Orden, entrega y recuperación

    - Cada partida tiene una secuencia `seq` monótona (la de sus eventos en Postgres).
      `RoundResolved` trae `previousSeq` y `seq`: el cliente aplica el delta solo si
      `previousSeq` coincide con su último `seq`; si no, pide `GetSnapshot`.
    - La entrega por WebSocket es *at-most-once*; la recuperación es siempre por `Snapshot`.
    - `SubmitOrder` es idempotente por `clientActionId` (UUID v7 generado en el cliente):
      ante un *timeout* el cliente reintenta con el **mismo** id.
    - Ningún mensaje revela información oculta de otro jugador: órdenes antes de resolver,
      pactos, opciones de draft, bendiciones ajenas, contenido de cofres, casillas fuera de visión
      ni héroes en sigilo. Cada jugador recibe su propia vista.

    ## 5. Versionado y compatibilidad

    - **`protocolVersion`** (entero, *query* del *upgrade*) es la versión **mayor** del protocolo.
      Esta especificación define `protocolVersion=1`. `info.version` sigue SemVer y su mayor coincide.
    - Dentro de una versión mayor solo hay **cambios aditivos** (sube la menor):
      campos opcionales nuevos, mensajes servidor→cliente nuevos, códigos de error nuevos y
      valores nuevos en enumeraciones marcadas como extensibles (`VisibleEvent.type`).
      Los clientes **deben ignorar** campos y mensajes desconocidos.
    - Un cambio incompatible (quitar o renombrar un campo, cambiar un tipo, endurecer una
      validación) exige una versión mayor nueva. El servidor acepta la mayor actual y la anterior
      durante al menos 30 días; luego rechaza la vieja con `UNSUPPORTED_PROTOCOL_VERSION`.
    - Cada mensaje declara `x-since` (versión en que apareció). Los cambios se registran en
      `docs/adr/` y en el changelog de la versión.
  contact:
    name: Equipo Ascua
    url: https://github.com/JanPMolina/ascua
  tags:
    - name: invocacion
      description: Cliente → servidor (invocación de un método del hub con ACK).
    - name: difusion
      description: Servidor → todos los jugadores de la partida.
    - name: privado
      description: Servidor → un solo jugador; contiene información que solo él puede ver.
    - name: sistema
      description: Mensajes de operación del servidor (errores, drenado).
  externalDocs:
    description: Arquitectura y decisiones (ADRs)
    url: https://github.com/JanPMolina/ascua/tree/main/docs/adr

defaultContentType: application/x-msgpack

servers:
  production:
    host: '{apiHost}'
    protocol: wss
    pathname: /realtime/match
    title: Azure Container Apps
    summary: Ingress HTTPS/WSS de Container Apps (dev y prod).
    variables:
      apiHost:
        default: ascua-api.azurecontainerapps.io
        description: FQDN del ingress del ambiente (dev o prod).
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'
  local:
    host: localhost:8080
    protocol: ws
    pathname: /realtime/match
    title: Desarrollo local
    summary: Solo para desarrollo; admite JSON para depuración.
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'

channels:
  match:
    address: /realtime/match
    title: Hub de partida
    description: |
      Conexión SignalR de un jugador. Tras `JoinMatch` la conexión entra al grupo `match:{matchId}`
      (difusiones) y recibe además los mensajes privados dirigidos a su usuario.
    servers:
      - $ref: '#/servers/production'
      - $ref: '#/servers/local'
    bindings:
      ws:
        method: GET
        query:
          type: object
          additionalProperties: false
          required: [protocolVersion, access_token]
          properties:
            protocolVersion:
              type: string
              enum: ['1']
              description: Versión mayor del protocolo de Ascua.
            access_token:
              type: string
              minLength: 43
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
              description: Ticket de un solo uso emitido por `POST /api/v1/realtime/tickets`.
        bindingVersion: 0.1.0
    messages:
      JoinMatch:
        $ref: '#/components/messages/JoinMatch'
      JoinMatchAck:
        $ref: '#/components/messages/JoinMatchAck'
      SubmitOrder:
        $ref: '#/components/messages/SubmitOrder'
      SubmitOrderAck:
        $ref: '#/components/messages/SubmitOrderAck'
      GetSnapshot:
        $ref: '#/components/messages/GetSnapshot'
      LeaveMatch:
        $ref: '#/components/messages/LeaveMatch'
      LeaveMatchAck:
        $ref: '#/components/messages/LeaveMatchAck'
      DraftPick:
        $ref: '#/components/messages/DraftPick'
      DraftPickAck:
        $ref: '#/components/messages/DraftPickAck'
      InvocationError:
        $ref: '#/components/messages/InvocationError'
      RoundOpened:
        $ref: '#/components/messages/RoundOpened'
      PlayerDecided:
        $ref: '#/components/messages/PlayerDecided'
      RoundResolved:
        $ref: '#/components/messages/RoundResolved'
      Snapshot:
        $ref: '#/components/messages/Snapshot'
      DraftOffer:
        $ref: '#/components/messages/DraftOffer'
      PlayerConnectionChanged:
        $ref: '#/components/messages/PlayerConnectionChanged'
      MatchFinished:
        $ref: '#/components/messages/MatchFinished'
      ServerDraining:
        $ref: '#/components/messages/ServerDraining'
      Error:
        $ref: '#/components/messages/Error'

operations:
  # ───────────── Cliente → servidor ─────────────
  joinMatch:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: JoinMatch
    summary: Asocia la conexión a una partida en la que el usuario ya es participante.
    description: |
      No agrega al usuario a la partida (eso se hace por REST); solo suscribe la conexión.
      Si el usuario estaba desconectado, cancela su gracia y se difunde `PlayerConnectionChanged`.
      Si ya había otra conexión del mismo usuario en la partida, esa se cierra con `SESSION_REPLACED`.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/JoinMatch'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/JoinMatchAck'
        - $ref: '#/channels/match/messages/InvocationError'
  submitOrder:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: SubmitOrder
    summary: Envía la orden secreta del jugador para la ronda abierta.
    description: |
      Validación en orden: esquema y tamaño → participante → héroe activo → `round` igual a la
      ronda abierta → legalidad de la orden. La primera orden aceptada de la ronda es definitiva.
      Idempotente por `clientActionId`. Si con esta orden ya decidieron todos los vivos,
      el servidor intenta cerrar la ronda de inmediato.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/SubmitOrder'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/SubmitOrderAck'
        - $ref: '#/channels/match/messages/InvocationError'
  getSnapshot:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: GetSnapshot
    summary: Pide la vista completa del jugador (al reconectar o al detectar un hueco de `seq`).
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/GetSnapshot'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/Snapshot'
        - $ref: '#/channels/match/messages/InvocationError'
  leaveMatch:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: LeaveMatch
    summary: Abandona la partida de forma voluntaria.
    description: |
      En `Lobby` o `Drafting` el jugador simplemente sale. En `InProgress` es un **abandono
      inmediato** (sin gracia): el héroe se retira y pierde todas sus ascuas.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/LeaveMatch'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/LeaveMatchAck'
        - $ref: '#/channels/match/messages/InvocationError'
  draftPick:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: DraftPick
    summary: Elige 1 de las 2 bendiciones de una `DraftOffer`.
    description: |
      Idempotente: repetir la misma elección devuelve el mismo ACK. Si vence el plazo sin
      elección, el servidor elige al azar (CSPRNG) entre las dos opciones.
    tags:
      - name: invocacion
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/DraftPick'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/DraftPickAck'
        - $ref: '#/channels/match/messages/InvocationError'

  # ───────────── Servidor → cliente ─────────────
  sendRoundOpened:
    action: send
    channel:
      $ref: '#/channels/match'
    title: RoundOpened
    summary: Abre la fase de planificación de una ronda.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/RoundOpened'
  sendPlayerDecided:
    action: send
    channel:
      $ref: '#/channels/match'
    title: PlayerDecided
    summary: Avisa que un jugador ya envió su orden, sin revelarla.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/PlayerDecided'
  sendRoundResolved:
    action: send
    channel:
      $ref: '#/channels/match'
    title: RoundResolved
    summary: Resultado de la ronda como delta de la vista de cada jugador.
    description: Cada jugador recibe **su propio** delta, calculado por el proyector de vistas.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/RoundResolved'
  sendSnapshot:
    action: send
    channel:
      $ref: '#/channels/match'
    title: Snapshot
    summary: Vista completa del jugador, empujada por el servidor cuando un delta no basta.
    description: |
      Además de responder a `GetSnapshot`, el servidor la empuja al cambiar de sala (piso)
      o al recuperar una partida tras la caída de una réplica.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/Snapshot'
  sendDraftOffer:
    action: send
    channel:
      $ref: '#/channels/match'
    title: DraftOffer
    summary: Ofrece 2 bendiciones a un solo jugador (draft inicial o altar).
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/DraftOffer'
  sendPlayerConnectionChanged:
    action: send
    channel:
      $ref: '#/channels/match'
    title: PlayerConnectionChanged
    summary: Un jugador se desconectó, volvió o abandonó.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/PlayerConnectionChanged'
  sendMatchFinished:
    action: send
    channel:
      $ref: '#/channels/match'
    title: MatchFinished
    summary: Resultado final e inmutable, con los pactos revelados.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/MatchFinished'
  sendServerDraining:
    action: send
    channel:
      $ref: '#/channels/match'
    title: ServerDraining
    summary: La réplica se va a apagar; el cliente debe reconectarse.
    tags:
      - name: sistema
    messages:
      - $ref: '#/channels/match/messages/ServerDraining'
  sendError:
    action: send
    channel:
      $ref: '#/channels/match'
    title: Error
    summary: Error que no corresponde a la respuesta de una invocación.
    tags:
      - name: sistema
    messages:
      - $ref: '#/channels/match/messages/Error'

components:
  securitySchemes:
    realtimeTicket:
      type: httpApiKey
      name: access_token
      in: query
      description: |
        Ticket opaco de un solo uso (32 bytes aleatorios en base64url), válido 30 s, atado a
        usuario y partida. Se obtiene con `POST /api/v1/realtime/tickets` usando el JWT de acceso
        y se consume con `GETDEL` en el *upgrade*. Inválido → HTTP 401 `TICKET_INVALID`.

  correlationIds:
    clientAction:
      description: Correlaciona `SubmitOrder` con su ACK (y con reenvíos) por `clientActionId`.
      location: $message.payload#/clientActionId

  messageTraits:
    signalrInvocation:
      contentType: application/x-msgpack
      description: |
        Se transporta como un mensaje `Invocation` de SignalR (tipo 1) cuyo `target` es el
        nombre del mensaje y cuyo único argumento es el *payload*. La respuesta llega como
        `Completion` (tipo 3) con el mismo `invocationId`.
    signalrPush:
      contentType: application/x-msgpack
      description: |
        Se transporta como un mensaje `Invocation` de SignalR (tipo 1) sin `invocationId`,
        con `target` igual al nombre del mensaje y un único argumento: el *payload*.

  messages:
    # ───────────── Invocaciones y respuestas ─────────────
    JoinMatch:
      name: JoinMatch
      title: JoinMatch
      summary: Suscribir la conexión a una partida.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, NOT_PARTICIPANT, MATCH_NOT_FOUND, MATCH_NOT_ACTIVE, ALREADY_IN_ANOTHER_MATCH, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/JoinMatchRequest'
      examples:
        - name: unirse
          summary: Unirse a una partida en curso.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182

    JoinMatchAck:
      name: JoinMatchAck
      title: ACK de JoinMatch
      summary: Confirmación con el asiento y la vista completa del jugador.
      x-since: 1.0.0
      tags:
        - name: invocacion
        - name: privado
      payload:
        $ref: '#/components/schemas/JoinMatchAck'
      examples:
        - name: unido
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            playerId: 0193a1b0-1111-7c00-9a00-00000000a001
            seat: 1
            snapshot:
              matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
              seq: 0
              serverTime: '2026-11-03T18:00:00Z'
              view:
                status: LOBBY
                round: 0
                floor: 1
                roundDeadline: null
                me:
                  playerId: 0193a1b0-1111-7c00-9a00-00000000a001
                  displayName: ana
                  hero: CHISPA
                  state: ALIVE
                  hp: 4
                  maxHp: 4
                  shield: 0
                  position: { x: 1, y: 1 }
                  facing: E
                  embers: 0
                  charges: 0
                  abilityCooldown: 0
                  stealthRoundsLeft: 0
                  downRoundsLeft: null
                  blessings: []
                  pact: null
                  decided: false
                  pendingOrder: null
                allies: []
                enemies: []
                tiles: []

    SubmitOrder:
      name: SubmitOrder
      title: SubmitOrder
      summary: Orden secreta del jugador para la ronda `round`.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, INVALID_ORDER, STALE_ROUND, ORDER_ALREADY_SUBMITTED, DUPLICATE_ACTION, NOT_PARTICIPANT, NOT_JOINED, PLAYER_DOWN, MATCH_NOT_ACTIVE, RATE_LIMITED, MESSAGE_TOO_LARGE, INTERNAL_ERROR]
      correlationId:
        $ref: '#/components/correlationIds/clientAction'
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/SubmitOrderRequest'
      examples:
        - name: mover
          summary: Mover una casilla al norte en la ronda 7.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            round: 7
            clientActionId: 0193a1d4-9b21-7e33-a4f0-5c6d7e8f9012
            order:
              type: MOVE
              direction: N
        - name: guardar
