operations:
  # ───────────── Cliente → servidor ─────────────
  joinMatch:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: JoinMatch
    summary: Asocia la conexión a una partida en la que el usuario ya es participante.
    description: |
      No agrega al usuario a la partida (eso se hace por REST); solo suscribe la conexión.
      Si el usuario estaba desconectado, cancela su gracia y se difunde `PlayerConnectionChanged`.
      Si ya había otra conexión del mismo usuario en la partida, esa se cierra con `SESSION_REPLACED`.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/JoinMatch'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/JoinMatchAck'
        - $ref: '#/channels/match/messages/InvocationError'
  submitOrder:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: SubmitOrder
    summary: Envía la orden secreta del jugador para la ronda abierta.
    description: |
      Validación en orden: esquema y tamaño → participante → héroe activo → `round` igual a la
      ronda abierta → legalidad de la orden. La primera orden aceptada de la ronda es definitiva.
      Idempotente por `clientActionId`. Si con esta orden ya decidieron todos los vivos,
      el servidor intenta cerrar la ronda de inmediato.

      Desde 1.3.0 también dan órdenes la Brasa errante (`EMBER_SPIRIT`: `MOVE` = Deriva, `ABILITY` = Avivar,
      `INTERACT` = Reavivar, `ATTACK` = Estorbo, `GUARD` = Faro; Estorbo en enfriamiento → `INVALID_ORDER`)
      y el Renegado ya presente (`RENEGADE`, con las mismas órdenes que su héroe). Un extinto o un Renegado
      que aún no apareció recibe `PLAYER_DOWN`.

      Desde 2.0.0, con el Repique sonando, una orden que llega después del plazo reducido recibe
      `ORDER_TOO_LATE`, salvo que sea de quien lo tocó.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/SubmitOrder'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/SubmitOrderAck'
        - $ref: '#/channels/match/messages/InvocationError'
  getSnapshot:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: GetSnapshot
    summary: Pide la vista completa del jugador (al reconectar o al detectar un hueco de `seq`).
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/GetSnapshot'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/Snapshot'
        - $ref: '#/channels/match/messages/InvocationError'
  leaveMatch:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: LeaveMatch
    summary: Abandona la partida de forma voluntaria.
    description: |
      En `Lobby` o `Drafting` el jugador simplemente sale. En `InProgress` es un **abandono
      inmediato** (sin gracia): el héroe se retira y pierde todas sus ascuas.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/LeaveMatch'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/LeaveMatchAck'
        - $ref: '#/channels/match/messages/InvocationError'
  draftPick:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: DraftPick
    summary: Elige 1 de las 2 bendiciones de una `DraftOffer`.
    description: |
      Idempotente: repetir la misma elección devuelve el mismo ACK. Si vence el plazo sin
      elección, el servidor elige al azar (CSPRNG) entre las dos opciones.
    tags:
      - name: invocacion
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/DraftPick'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/DraftPickAck'
        - $ref: '#/channels/match/messages/InvocationError'
  choosePath:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: ChoosePath
    summary: Elige camino tras extinguirse (Camino de la Amistad o de la Venganza).
    description: |
      Responde a una `PathOffer`. Validación en orden: esquema → idempotencia → participante → partida
      en curso → oferta vigente (`offerId` de la extinción actual, sin elección previa). Vale la primera
      elección: repetirla devuelve el mismo ACK con `result: DUPLICATE_ACTION` y cambiarla da
      `PATH_CLOSED`. La elección es **privada** hasta que se resuelve la ronda (`PATH_CHOSEN`). Si vence el
      plazo (15 s desde que abrió la ronda) el servidor elige `FRIENDSHIP`. Desde 1.3.0.
    tags:
      - name: invocacion
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/ChoosePath'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/ChoosePathAck'
        - $ref: '#/channels/match/messages/InvocationError'
  sendSignal:
    action: receive
    channel:
      $ref: '#/channels/match'
    title: SendSignal
    summary: Envía a tu bando una frase fija y, si quieres, una casilla marcada.
    description: |
      Es información libre: también se puede mentir. Se valida que la casilla esté en el tablero y que
      no hayas enviado otra señal hace menos de 3 s (`RATE_LIMITED` con `retryAfterMs`). No toca la partida,
      no se guarda ni aparece en la reproducción. Desde 2.0.0.
    tags:
      - name: invocacion
    messages:
      - $ref: '#/channels/match/messages/SendSignal'
    reply:
      channel:
        $ref: '#/channels/match'
      messages:
        - $ref: '#/channels/match/messages/SendSignalAck'
        - $ref: '#/channels/match/messages/InvocationError'

  # ───────────── Servidor → cliente ─────────────
  sendRoundOpened:
    action: send
    channel:
      $ref: '#/channels/match'
    title: RoundOpened
    summary: Abre la fase de planificación de una ronda.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/RoundOpened'
  sendPlayerDecided:
    action: send
    channel:
      $ref: '#/channels/match'
    title: PlayerDecided
    summary: Avisa que un jugador ya envió su orden, sin revelarla.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/PlayerDecided'
  sendRoundResolved:
    action: send
    channel:
      $ref: '#/channels/match'
    title: RoundResolved
    summary: Resultado de la ronda como delta de la vista de cada jugador.
    description: Cada jugador recibe **su propio** delta, calculado por el proyector de vistas.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/RoundResolved'
  sendSnapshot:
    action: send
    channel:
      $ref: '#/channels/match'
    title: Snapshot
    summary: Vista completa del jugador, empujada por el servidor cuando un delta no basta.
    description: |
      Además de responder a `GetSnapshot`, el servidor la empuja al cambiar de sala (piso)
      o al recuperar una partida tras la caída de una réplica.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/Snapshot'
  sendDraftOffer:
    action: send
    channel:
      $ref: '#/channels/match'
    title: DraftOffer
    summary: Ofrece 2 bendiciones a un solo jugador (draft inicial o altar).
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/DraftOffer'
  sendPathOffer:
    action: send
    channel:
      $ref: '#/channels/match'
    title: PathOffer
    summary: Oferta privada de camino a un jugador que se acaba de extinguir.
    description: |
      Llega justo después del `RoundResolved` en el que se extinguió y se reenvía tras `JoinMatch` y
      `GetSnapshot` mientras siga abierta. Una oferta nueva por extinción (`offerId` distinto). Desde 1.3.0.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/PathOffer'
  sendLastWord:
    action: send
    channel:
      $ref: '#/channels/match'
    title: LastWord
    summary: Último en hablar. Las órdenes de los demás, solo para el Campanero.
    description: |
      Llega cuando todos los demás ya decidieron (o venció su plazo con el Repique) y él todavía no. Se
      reenvía tras `JoinMatch` y `GetSnapshot` mientras siga aplicando. Desde 2.0.0.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/LastWord'
  sendSignalReceived:
    action: send
    channel:
      $ref: '#/channels/match'
    title: SignalReceived
    summary: Señal rápida de alguien de tu bando (también la propia). Desde 2.0.0.
    tags:
      - name: privado
    messages:
      - $ref: '#/channels/match/messages/SignalReceived'
  sendPlayerConnectionChanged:
    action: send
    channel:
      $ref: '#/channels/match'
    title: PlayerConnectionChanged
    summary: Un jugador se desconectó, volvió o abandonó.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/PlayerConnectionChanged'
  sendMatchFinished:
    action: send
    channel:
      $ref: '#/channels/match'
    title: MatchFinished
    summary: Resultado final e inmutable, con los pactos y las traiciones revelados.
    tags:
      - name: difusion
    messages:
      - $ref: '#/channels/match/messages/MatchFinished'
  sendServerDraining:
    action: send
    channel:
      $ref: '#/channels/match'
    title: ServerDraining
    summary: La réplica se va a apagar; el cliente debe reconectarse.
    tags:
      - name: sistema
    messages:
      - $ref: '#/channels/match/messages/ServerDraining'
  sendError:
    action: send
    channel:
      $ref: '#/channels/match'
    title: Error
    summary: Error que no corresponde a la respuesta de una invocación.
    tags:
      - name: sistema
    messages:
      - $ref: '#/channels/match/messages/Error'

components:
  securitySchemes:
    realtimeTicket:
      type: httpApiKey
      name: access_token
      in: query
      description: |
        Ticket opaco de un solo uso (32 bytes aleatorios en base64url), válido 30 s, atado a
        usuario y partida. Se obtiene con `POST /api/v1/realtime/tickets` usando el JWT de acceso
        y se consume con `GETDEL` en el *upgrade*. Inválido → HTTP 401 `TICKET_INVALID`.

  correlationIds:
    clientAction:
      description: Correlaciona `SubmitOrder` con su ACK (y con reenvíos) por `clientActionId`.
      location: $message.payload#/clientActionId

  messageTraits:
    signalrInvocation:
      contentType: application/x-msgpack
      description: |
        Se transporta como un mensaje `Invocation` de SignalR (tipo 1) cuyo `target` es el
        nombre del mensaje y cuyo único argumento es el *payload*. La respuesta llega como
        `Completion` (tipo 3) con el mismo `invocationId`.
    signalrPush:
      contentType: application/x-msgpack
      description: |
        Se transporta como un mensaje `Invocation` de SignalR (tipo 1) sin `invocationId`,
        con `target` igual al nombre del mensaje y un único argumento: el *payload*.

  messages:
    # ───────────── Invocaciones y respuestas ─────────────
    JoinMatch:
      name: JoinMatch
      title: JoinMatch
      summary: Suscribir la conexión a una partida.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, NOT_PARTICIPANT, MATCH_NOT_FOUND, MATCH_NOT_ACTIVE, ALREADY_IN_ANOTHER_MATCH, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/JoinMatchRequest'
      examples:
        - name: unirse
          summary: Unirse a una partida en curso.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182

    JoinMatchAck:
      name: JoinMatchAck
      title: ACK de JoinMatch
      summary: Confirmación con el asiento y la vista completa del jugador.
      x-since: 1.0.0
      tags:
        - name: invocacion
        - name: privado
      payload:
        $ref: '#/components/schemas/JoinMatchAck'
      examples:
        - name: unido
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            playerId: 0193a1b0-1111-7c00-9a00-00000000a001
            seat: 1
            snapshot:
              matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
              seq: 0
              serverTime: '2026-11-03T18:00:00Z'
              view:
                status: LOBBY
                round: 0
                floor: 1
                roundDeadline: null
                me:
                  playerId: 0193a1b0-1111-7c00-9a00-00000000a001
                  displayName: ana
                  hero: ANTEAYER
                  state: ALIVE
                  hp: 4
                  maxHp: 4
                  shield: 0
                  position: { x: 1, y: 1 }
                  facing: E
                  embers: 0
                  abilityCooldown: 0
                  downRoundsLeft: null
                  blessings: []
                  pact: null
                  decided: false
                  pendingOrder: null
                allies: []
                enemies: []
                tiles: []

    SubmitOrder:
      name: SubmitOrder
      title: SubmitOrder
      summary: Orden secreta del jugador para la ronda `round`.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, INVALID_ORDER, STALE_ROUND, ORDER_ALREADY_SUBMITTED, ORDER_TOO_LATE, DUPLICATE_ACTION, NOT_PARTICIPANT, NOT_JOINED, PLAYER_DOWN, MATCH_NOT_ACTIVE, RATE_LIMITED, MESSAGE_TOO_LARGE, INTERNAL_ERROR]
      correlationId:
        $ref: '#/components/correlationIds/clientAction'
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/SubmitOrderRequest'
      examples:
        - name: mover
          summary: Mover una casilla al norte en la ronda 7.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            round: 7
            clientActionId: 0193a1d4-9b21-7e33-a4f0-5c6d7e8f9012
            order:
              type: MOVE
              direction: N
        - name: guardar
          summary: '`GUARD` no lleva dirección.'
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            round: 7
            clientActionId: 0193a1d4-9b21-7e33-a4f0-5c6d7e8f9013
            order:
              type: GUARD

    SubmitOrderAck:
      name: SubmitOrderAck
      title: ACK de SubmitOrder
      summary: La orden quedó registrada (o era un reenvío idempotente).
      x-since: 1.0.0
      correlationId:
        $ref: '#/components/correlationIds/clientAction'
      tags:
        - name: invocacion
      payload:
        $ref: '#/components/schemas/SubmitOrderAck'
      examples:
        - name: aceptada
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            round: 7
            clientActionId: 0193a1d4-9b21-7e33-a4f0-5c6d7e8f9012
            result: ACCEPTED
            receivedAt: '2026-11-03T18:02:11.482Z'
        - name: reenvio
          summary: Mismo `clientActionId`; se devuelve el ACK original sin aplicar nada.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            round: 7
            clientActionId: 0193a1d4-9b21-7e33-a4f0-5c6d7e8f9012
            result: DUPLICATE_ACTION
            receivedAt: '2026-11-03T18:02:11.482Z'

    GetSnapshot:
      name: GetSnapshot
      title: GetSnapshot
      summary: Pedir la vista completa del jugador.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, NOT_PARTICIPANT, NOT_JOINED, MATCH_NOT_FOUND, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/GetSnapshotRequest'
      examples:
        - name: pedir
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182

    LeaveMatch:
      name: LeaveMatch
      title: LeaveMatch
      summary: Salir de la partida.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, NOT_PARTICIPANT, NOT_JOINED, MATCH_NOT_ACTIVE, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/LeaveMatchRequest'
      examples:
        - name: salir
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182

    LeaveMatchAck:
      name: LeaveMatchAck
      title: ACK de LeaveMatch
      summary: El jugador salió; `abandoned` indica si contó como abandono.
      x-since: 1.0.0
      tags:
        - name: invocacion
      payload:
        $ref: '#/components/schemas/LeaveMatchAck'
      examples:
        - name: abandono
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            leftAt: '2026-11-03T18:05:00Z'
            abandoned: true

    DraftPick:
      name: DraftPick
      title: DraftPick
      summary: Elegir una bendición de la oferta.
      x-since: 1.0.0
      x-errors: [INVALID_PAYLOAD, INVALID_PICK, DRAFT_CLOSED, NOT_PARTICIPANT, NOT_JOINED, PLAYER_DOWN, MATCH_NOT_ACTIVE, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
        - name: privado
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/DraftPickRequest'
      examples:
        - name: elegir
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000f1
            blessingId: LAMPARA

    DraftPickAck:
      name: DraftPickAck
      title: ACK de DraftPick
      summary: La bendición quedó asignada al jugador.
      x-since: 1.0.0
      tags:
        - name: invocacion
        - name: privado
      payload:
        $ref: '#/components/schemas/DraftPickAck'
      examples:
        - name: elegida
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000f1
            blessingId: LAMPARA
            acceptedAt: '2026-11-03T18:00:41Z'

    ChoosePath:
      name: ChoosePath
      title: ChoosePath
      summary: Elegir camino tras extinguirse.
      x-since: 1.3.0
      x-errors: [INVALID_PAYLOAD, PATH_CLOSED, NOT_PARTICIPANT, NOT_JOINED, MATCH_NOT_FOUND, MATCH_NOT_ACTIVE, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
        - name: privado
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/ChoosePathRequest'
      examples:
        - name: venganza
          summary: Volver como Renegado.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000c7
            path: VENGEANCE
        - name: amistad
          summary: Seguir como Brasa errante.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000c7
            path: FRIENDSHIP

    ChoosePathAck:
      name: ChoosePathAck
      title: ACK de ChoosePath
      summary: La elección quedó registrada (privada hasta que se resuelve la ronda).
      x-since: 1.3.0
      tags:
        - name: invocacion
        - name: privado
      payload:
        $ref: '#/components/schemas/ChoosePathAck'
      examples:
        - name: aceptada
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000c7
            path: VENGEANCE
            result: ACCEPTED
            acceptedAt: '2026-11-03T18:07:12Z'
        - name: reenvio
          summary: La misma elección repetida devuelve el ACK original.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            offerId: 0193a1c3-0000-7d00-8000-0000000000c7
            path: VENGEANCE
            result: DUPLICATE_ACTION
            acceptedAt: '2026-11-03T18:07:12Z'

    SendSignal:
      name: SendSignal
      title: SendSignal
      summary: Señal rápida a tu bando.
      x-since: 2.0.0
      x-errors: [INVALID_PAYLOAD, NOT_PARTICIPANT, NOT_JOINED, PLAYER_DOWN, MATCH_NOT_FOUND, MATCH_NOT_ACTIVE, RATE_LIMITED, INTERNAL_ERROR]
      tags:
        - name: invocacion
      traits:
        - $ref: '#/components/messageTraits/signalrInvocation'
      payload:
        $ref: '#/components/schemas/SendSignalRequest'
      examples:
        - name: cuidado
          summary: «¡Cuidado!» marcando una casilla.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
            kind: DANGER
            position: { x: 3, y: 3 }
        - name: ayuda
          summary: «Ayuda», sin casilla.
          payload:
            matchId: 0193a1c2-5e7f-7a10-8b2c-3d4e5f607182
