# Entorno local completo: docker compose up --build  →  http://localhost:8080
# Las credenciales de aquí son SOLO para desarrollo local; en Azure se usa identidad administrada.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=ascua;Username=ascua;Password=${POSTGRES_PASSWORD:-ascua_local}"
      ConnectionStrings__Redis: "redis:6379"
      Ascua__Database__MigrateOnStartup: "true"
      # Habilita POST /api/v1/dev/matches (partida sin sala) para el bot y las pruebas manuales.
      Ascua__Realtime__EnableDevEndpoints: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Bot que registra 2 jugadores y juega una partida completa: docker compose --profile bot up --build
  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: src/Ascua.Bot/Dockerfile
    command: ["http://api:8080", "2", "300"]
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ascua
      POSTGRES_USER: ascua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ascua_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascua -d ascua"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
