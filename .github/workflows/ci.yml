name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Ascua.slnx
      - run: dotnet format Ascua.slnx --verify-no-changes --no-restore
      - run: dotnet build Ascua.slnx -c Release --no-restore
      - run: dotnet test Ascua.slnx -c Release --no-build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar AsyncAPI
        run: npx --yes @asyncapi/cli@3 validate contracts/asyncapi.yaml

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ascua-api:ci .
      - name: Escanear imagen (falla con vulnerabilidades crÃ­ticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ascua-api:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
